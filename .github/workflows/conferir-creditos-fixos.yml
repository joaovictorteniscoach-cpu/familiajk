name: Conferir créditos fixos e referência pública
on:
  push:
    branches: [codex/creditos-unicos-implantacao-2026-11-12]
    paths:
      - ferramentas/creditos-fixos.cjs
      - ferramentas/testar-creditos-fixos.cjs
      - .github/workflows/conferir-creditos-fixos.yml
      - app-gestao/**
      - app-aluno/**
      - ferramentas/testar-agenda-domingo-browser.cjs
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir matemática com dados fictícios
        run: node ferramentas/testar-creditos-fixos.cjs
      - name: Preparar testes da agenda e gerar prévias fictícias
        env:
          NODE_PATH: ${{ runner.temp }}/jv-browser/node_modules
          JV_VISUAL_DIR: ${{ runner.temp }}/previas-domingo
        run: |
          git config --global --add safe.directory "$(pwd -P)"
          npm install --prefix "$RUNNER_TEMP/jv-browser" playwright@1.56.1
          python3 site-pro/tools/build_demo.py
          git diff --exit-code -- site-pro/demo/
          node ferramentas/testar-agenda-domingo-browser.cjs
      - name: Exibir duas prévias para revisão do João
        env:
          JV_VISUAL_DIR: ${{ runner.temp }}/previas-domingo
        run: |
          python3 - <<'PY'
          import base64, os, hashlib
          for name in ['domingo-app-aluno-webkit-saibro.png', 'domingo-app-gestao-webkit-saibro.png']:
              raw = open(os.path.join(os.environ['JV_VISUAL_DIR'], name), 'rb').read()
              encoded = base64.b64encode(raw).decode()
              print('JV_PREVIEW_INFO:' + name + ':' + str(len(raw)) + ':' + hashlib.sha256(raw).hexdigest())
              for n in range(0, len(encoded), 1000):
                  print('JV_PREVIEW_PART:' + name + ':' + encoded[n:n+1000])
          PY
      - name: Ler somente a página pública indicada pelo João
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          class Pagina(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ignorar = 0
                  self.textos = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style', 'noscript'): self.ignorar += 1
                  if tag == 'a':
                      href = dict(attrs).get('href', '')
                      if href.startswith('http') and href not in self.links: self.links.append(href)
              def handle_endtag(self, tag):
                  if tag in ('script', 'style', 'noscript'): self.ignorar = max(0, self.ignorar - 1)
              def handle_data(self, text):
                  if not self.ignorar:
                      t = ' '.join(text.split())
                      if t: self.textos.append(t)
          url = 'https://atacante.app/sistema-para-tenis/'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (compatible; JV-Comparacao-Publica/1.0)'})
          with urllib.request.urlopen(req, timeout=30) as r:
              print('REFERENCIA_URL:', r.url)
              html = r.read(2000000).decode('utf-8', errors='replace')
          p = Pagina(); p.feed(html)
          print('REFERENCIA_TEXTO_INICIO')
          print('\n'.join(p.textos)[:40000])
          print('REFERENCIA_TEXTO_FIM')
          print('LINKS_PUBLICOS:', '\n'.join(p.links[:45]))
          PY

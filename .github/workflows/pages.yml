# Segundo endereço dos apps, no GitHub Pages.
#
# Por que existe: quando os créditos do Netlify acabaram, nada era publicado e
# o app ficou sem atualizar. O Pages é gratuito e não tem cota que acabe, então
# serve de porta reserva para a MESMA academia — o Firebase é o mesmo, os dados
# são os mesmos. Não é uma cópia paralela; é outro caminho para a mesma casa.
#
# LIGAR UMA VEZ: Settings → Pages → Source: "GitHub Actions".
# Depois disso os endereços passam a ser:
#   https://<usuario>.github.io/familiajk/app-gestao/
#   https://<usuario>.github.io/familiajk/app-aluno/
#   https://<usuario>.github.io/familiajk/site/
#
# Funciona sem tocar no código porque todos os caminhos dos apps são relativos
# (start_url "./", scope "./", sw-*.js, manifest-*.webmanifest).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite publicar na mão pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se chegar push novo no meio, deixa a atual terminar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # histórico completo: o checar-versao.py pergunta ao git quando cada
          # app mudou pela última vez. Com o checkout raso ele não acha commit
          # nenhum, devolve 0000-00-00 e passa sempre — portão que não barra
          # nada é pior que portão nenhum, porque dá falsa segurança.
          fetch-depth: 0
          persist-credentials: false

      - name: Validar antes de publicar
        # se um script estiver quebrado, é melhor não publicar do que publicar
        # um app que não abre
        run: |
          bash ferramentas/checar-tudo.sh
          node ferramentas/checar-sintaxe.js site-pro/index.html
          node ferramentas/checar-sintaxe.js site-pro/sistema.html
          node ferramentas/checar-sintaxe.js site-pro/curso.html
          node ferramentas/checar-sintaxe.js site-pro/demo/index.html

      - name: Preparar apenas os sites públicos
        run: python3 ferramentas/preparar-pages.py "$RUNNER_TEMP/pages"

      - uses: actions/configure-pages@v5

      - name: Empacotar os sites públicos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4

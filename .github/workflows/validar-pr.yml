name: Validar pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validar apps e sites
        run: |
          bash ferramentas/checar-tudo.sh
          node ferramentas/checar-sintaxe.js site-pro/index.html
          node ferramentas/checar-sintaxe.js site-pro/sistema.html
          node ferramentas/checar-sintaxe.js site-pro/curso.html
          node ferramentas/checar-sintaxe.js site-pro/demo/index.html
      - name: Validar o pacote público sem publicar
        run: python3 ferramentas/preparar-pages.py "$RUNNER_TEMP/pages"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador de teste
        run: |
          npm install --prefix "$RUNNER_TEMP/jv-browser" playwright@1.56.1
          "$RUNNER_TEMP/jv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Conferir Gestão e site no navegador sem dados reais
        env:
          NODE_PATH: ${{ runner.temp }}/jv-browser/node_modules
          PW: ${{ runner.temp }}/jv-browser/node_modules/playwright
        run: |
          node .claude/skills/publicar-versao/fumaca.cjs
          node ferramentas/testar-site-browser.cjs
          JV_VISUAL_LOG=1 node ferramentas/testar-contraste-fechamento-browser.cjs
          node ferramentas/testar-plano-familia-browser.cjs
          JV_VISUAL_LOG=1 node ferramentas/testar-seguranca-pagamentos-browser.cjs
          JV_WIDTHS=390,1280 JV_NO_SCREENSHOTS=1 node ferramentas/testar-premium-browser.cjs

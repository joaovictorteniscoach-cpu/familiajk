name: Recuperar previas de telas testadas

on:
  push:
    branches: [codex/previa-imagem-agenda-276]
    paths: [.github/workflows/previa-imagem-276.yml]

permissions:
  contents: read
  actions: read

jobs:
  imagem:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9e3776b1bcc484e678870f052ca3c7edb90a12e0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegadores para a previa sem dados reais
        run: |
          npm install --prefix "$RUNNER_TEMP/jv-preview" playwright@1.56.1
          "$RUNNER_TEMP/jv-preview/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Capturar Aluno e Gestao do commit proposto
        env:
          NODE_PATH: ${{ runner.temp }}/jv-preview/node_modules
          JV_VISUAL_DIR: ${{ runner.temp }}/previa-276
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("ferramentas/testar-envios-aluno-browser.cjs")
          source = p.read_text()
          assert source.count("await p.setViewportSize({width,height:844});") == 1
          source = source.replace("await p.setViewportSize({width,height:844});", "await p.setViewportSize({width,height:844});await p.evaluate(()=>document.fonts.ready);await p.waitForTimeout(150);")
          assert source.count("return {count:buttons.length,failures,viewport:document.documentElement.scrollWidth<=innerWidth+1};") == 1
          source = source.replace("return {count:buttons.length,failures,viewport:document.documentElement.scrollWidth<=innerWidth+1};", "return {count:buttons.length,failures,viewport:document.documentElement.scrollWidth<=innerWidth+1,metrics:buttons.map(b=>({id:b.id,font:getComputedStyle(b).font,spacing:getComputedStyle(b).letterSpacing,width:b.getBoundingClientRect().width,text:b.innerText,spans:[...b.querySelectorAll('span')].map(s=>({text:s.innerText,width:s.getBoundingClientRect().width}))}))};")
          assert source.count("assert.equal(measures.count,7);assert.deepEqual(measures.failures,[]);") == 1
          source = source.replace("assert.equal(measures.count,7);assert.deepEqual(measures.failures,[]);", "await screenshot('medicao-'+width);console.log('JV_NAV_METRICS:'+JSON.stringify({motor,tema,width,measures}));assert.equal(measures.count,7);assert.deepEqual(measures.failures,[],JSON.stringify(measures));")
          p.write_text(source)
          PY
          node ferramentas/testar-envios-aluno-browser.cjs
      - name: Ler previas com dados ficticios e resumos dos testes
        if: always()
        env:
          PREVIA_DIR: ${{ runner.temp }}/previa-276
        run: |
          python3 - <<'PY'
          import os, pathlib, base64, hashlib
          root = pathlib.Path(os.environ["PREVIA_DIR"])
          for name in ("envios-medicao-320-webkit-saibro.png", "envios-barra-390-chromium-saibro.png"):
              matches = list(root.rglob(name))
              assert len(matches) == 1, "Captura exata ausente ou duplicada"
              data = matches[0].read_bytes()
              assert data.startswith(b"\x89PNG\r\n\x1a\n"), "Imagem invalida"
              payload = base64.b64encode(data).decode("ascii")
              print("JV_PREVIEW_INFO:"+name+":"+str(len(data))+":"+hashlib.sha256(data).hexdigest())
              for offset in range(0, len(payload), 1000):
                  print("JV_PREVIEW_PART:"+name+":"+payload[offset:offset+1000])
              print("JV_PREVIEW_END:"+name)
          for log in root.rglob("jv-browser-checks.log"):
              for line in log.read_text().splitlines():
                  if "cenários de abertura paralela" in line or "cenários de envios" in line:
                      print("JV_TEST_SUMMARY:"+line)
          PY

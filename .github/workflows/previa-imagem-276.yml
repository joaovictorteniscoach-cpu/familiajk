name: Conferir testes finais da agenda
on:
  push:
    branches: [codex/previa-imagem-agenda-276]
    paths: [.github/workflows/previa-imagem-276.yml]
permissions:
  contents: read
jobs:
  finais:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d02eac54cf3d0ac4933e88fa233b05a488932ab2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir atualização do domingo e testes finais preservados
        env:
          NODE_PATH: ${{ runner.temp }}/jv-browser/node_modules
          PW: ${{ runner.temp }}/jv-browser/node_modules/playwright
        run: |
          git config --global --add safe.directory "$(pwd -P)"
          npm install --prefix "$RUNNER_TEMP/jv-browser" playwright@1.56.1
          node ferramentas/testar-ferramentas-agenda-browser.cjs
          node ferramentas/testar-conexao-nuvem-aluno-browser.cjs
          node ferramentas/testar-creditos-marcas-browser.cjs
          node ferramentas/testar-avisos-celular-browser.cjs
          node ferramentas/testar-servidor-avisos.mjs
          node ferramentas/testar-resumo-escritorio-browser.cjs
          node ferramentas/testar-sincronizacao-familiajk.cjs
          node ferramentas/testar-seguranca-pagamentos-browser.cjs
          JV_WIDTHS=390,1280 JV_NO_SCREENSHOTS=1 node ferramentas/testar-premium-browser.cjs

name: Prévia da agenda em Dia e domingo
on:
  push:
    branches: [codex/previa-imagem-agenda-276]
    paths: [.github/workflows/previa-imagem-276.yml]
permissions:
  contents: read
jobs:
  imagem:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a5a978d91cbe32e1bfb98104585ddbcdb22ad0d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador e enquadrar prévias com dados fictícios
        env:
          NODE_PATH: ${{ runner.temp }}/jv-browser/node_modules
          JV_VISUAL_DIR: ${{ runner.temp }}/previas-domingo
        run: |
          npm install --prefix "$RUNNER_TEMP/jv-browser" playwright@1.56.1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ferramentas/testar-agenda-domingo-browser.cjs')
          s=p.read_text()
          old="   await p.waitForTimeout(150);\n   if(process.env.JV_VISUAL_DIR)"
          new="""   await p.bringToFront();
             await p.waitForTimeout(200);
             const enquadramento=await p.evaluate(app=>{
              if(app==='app-aluno')alunoWkZoomFit();else wkZoomFit();
              if(typeof rolarSemAnimacao==='function')rolarSemAnimacao(0);else window.scrollTo(0,0);
              const sc=document.querySelector('#ag-view .wk-scroll'),tb=document.querySelector('#ag-view .wk');
              return {app,zoom:app==='app-aluno'?alunoWkZoom:wkZoom,auto:app==='app-aluno'?alunoWkAutoFit:wkAutoFit,largura:sc?.clientWidth,tabela:tb?.getBoundingClientRect().width};
             },app);
             console.log('JV_ENQUADRAMENTO:'+JSON.stringify(enquadramento));
             await p.waitForTimeout(100);
             if(process.env.JV_VISUAL_DIR)"""
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          node ferramentas/testar-agenda-domingo-browser.cjs
      - name: Exibir prévias
        env:
          JV_VISUAL_DIR: ${{ runner.temp }}/previas-domingo
        run: |
          python3 - <<'PY'
          import base64, os, hashlib
          for name in ['domingo-app-aluno-webkit-saibro.png', 'domingo-app-gestao-webkit-saibro.png']:
              raw=open(os.path.join(os.environ['JV_VISUAL_DIR'], name),'rb').read()
              b=base64.b64encode(raw).decode()
              print('JV_PREVIEW_INFO:'+name+':'+str(len(raw))+':'+hashlib.sha256(raw).hexdigest())
              for n in range(0,len(b),1000): print('JV_PREVIEW_PART:'+name+':'+b[n:n+1000])
          PY

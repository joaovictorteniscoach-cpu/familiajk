<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Quadra de saibro estilizada">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05150f"/>
      <stop offset=".5" stop-color="#0b2418"/>
      <stop offset="1" stop-color="#102718"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f3f20"/>
      <stop offset=".45" stop-color="#b65a2b"/>
      <stop offset="1" stop-color="#6f2d18"/>
    </linearGradient>
    <radialGradient id="sun" cx=".76" cy=".24" r=".5">
      <stop offset="0" stop-color="#f0c968" stop-opacity=".75"/>
      <stop offset=".25" stop-color="#c78235" stop-opacity=".22"/>
      <stop offset="1" stop-color="#06140f" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <path d="M0 530 L1600 390 L1600 1000 L0 1000Z" fill="url(#clay)"/>
  <path d="M0 530 L1600 390 L1600 450 L0 590Z" fill="#2d3d24" opacity=".8"/>
  <g fill="none" stroke="#f4e6cf" stroke-opacity=".72" stroke-width="8">
    <path d="M120 1000 L570 548 L1350 487 L1600 650"/>
    <path d="M540 1000 L790 524"/>
    <path d="M1080 1000 L1040 505"/>
    <path d="M285 815 L1500 720"/>
  </g>
  <g opacity=".28" filter="url(#blur)">
    <circle cx="1300" cy="380" r="86" fill="#d9e955"/>
    <circle cx="1268" cy="352" r="24" fill="#f7ff9c"/>
  </g>
  <g opacity=".14" filter="url(#grain)">
    <rect width="1600" height="1000" fill="#fff"/>
  </g>
  <rect width="1600" height="1000" fill="#03100b" opacity=".26"/>
</svg>
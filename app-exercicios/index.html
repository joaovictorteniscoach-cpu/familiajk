<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Banco de Exercícios JV · Da Base ao Topo</title>
<meta name="description" content="Banco de exercícios da metodologia Da Base ao Topo: filtra por tema do mês, nível do aluno, bloco da aula e necessidade específica — e monta o plano de aula.">
<meta name="theme-color" content="#102438">
<!-- Ferramenta interna do professor, não página de venda: fora do Google.
     O conteúdo do banco é o miolo da formação (produto pago) — ver LEIA-ME.md. -->
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="jv-icone-exercicios.png">
<link rel="apple-touch-icon" href="jv-icone-exercicios-180.png">
<link rel="manifest" href="manifest-exercicios.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Exercícios JV">
<style>
:root{
  --navy:#102438; --navy-2:#15304A; --navy-3:#1C3F5E; --deep:#0B1B2B;
  --gold:#D8B45C; --gold-2:#C49A3F; --gold-soft:#E7CE93;
  --cream:#F4EFE6; --ink:#21303D;
  --muted:rgba(244,239,230,.62); --muted-2:rgba(244,239,230,.42);
  --line:rgba(216,180,92,.22); --line-2:rgba(244,239,230,.12);
  --ok:#7FA650; --warn:#E0784A; --r:14px;
  --topo:env(safe-area-inset-top,0px); --base:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--navy);-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--navy);color:var(--cream);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(84px + var(--base));
}
h1,h2,h3{line-height:1.15;letter-spacing:-.015em;font-weight:800}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}

/* ---------- barra de cima ---------- */
header.bar{
  position:sticky;top:0;z-index:50;background:rgba(11,27,43,.97);
  backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);
  padding-top:var(--topo);
}
.bar-in{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mono{width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--navy-3),var(--deep));color:var(--gold-soft);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.brand .nm{font-weight:800;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .nm small{display:block;font-weight:600;font-size:9px;letter-spacing:.14em;
  color:var(--gold-soft);text-transform:uppercase;margin-top:2px}
.bar .espaco{flex:1}
.ico-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;flex-shrink:0}
.ico-btn:active{transform:scale(.94)}
.selo{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:999px;
  background:var(--gold);color:#23303b;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0 5px}
.selo[hidden]{display:none}

/* ---------- foco do mês ---------- */
/* O mês cabe em uma linha. O detalhe (camada, frase, o que o mês trabalha)
   está a um toque no "i" — no topo ele era leitura ocupando meia tela. */
.foco{background:linear-gradient(150deg,var(--deep),var(--navy-3) 160%);
  border-bottom:1px solid var(--line);padding:9px 0}
.linha-mes{display:flex;align-items:center;gap:12px}
.linha-mes .tx{flex:1;min-width:0}
.foco .et{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.foco h1{font-size:clamp(19px,5.2vw,26px);margin:1px 0 0;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foco .ver{flex-shrink:0;width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line);color:var(--gold-soft);font-size:15px;font-weight:800;
  font-style:italic;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center}

/* ---------- tiras de filtro ---------- */
.tira{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;
  padding:9px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tira::-webkit-scrollbar{display:none}
.tira.centro{max-width:900px;margin:0 auto}
.chip{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);
  font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;background:var(--navy-2);
  line-height:1.25;text-align:center}
.chip:active{transform:scale(.96)}
.chip.on{background:linear-gradient(135deg,var(--gold-soft),var(--gold-2));color:#23303b;
  border-color:transparent;font-weight:800}
.chip .mm{display:block;font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.chip .gr{font-size:9.5px;font-weight:800;margin-left:5px;opacity:.6;
  border:1px solid currentColor;border-radius:4px;padding:0 3px;vertical-align:1px}
.chip.agora::after{content:"• agora";margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.06em}

.filtros{position:sticky;top:calc(58px + var(--topo));z-index:40;
  background:rgba(16,36,56,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2)}
/* Painel de filtros aberto: a barra para de ser fixa. Fixa em cima, fixa em
   baixo e painel aberto nao cabem num celular pequeno — o primeiro exercicio
   fica entalado e o dedo nao alcanca. Aberta, ela rola embora. */
.filtros.expandido{position:static}
.busca-linha{display:flex;gap:9px;padding:9px 16px 0;max-width:900px;margin:0 auto}
.busca{flex:1;display:flex;align-items:center;gap:9px;background:var(--navy-2);
  border:1px solid var(--line-2);border-radius:12px;padding:0 13px;height:44px}
.busca input{flex:1;background:none;border:none;color:var(--cream);font-size:15.5px;outline:none;min-width:0}
.busca input::placeholder{color:var(--muted-2)}
.mais{height:44px;padding:0 15px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--navy-2);font-size:13.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.mais.on{border-color:var(--gold);color:var(--gold-soft)}
.painel{display:none;padding:4px 16px 14px;max-width:900px;margin:0 auto}
.painel.aberto{display:block}
.painel .gr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.campo label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold);margin-bottom:5px}
.campo select{width:100%;height:42px;border-radius:11px;background:var(--navy-2);
  border:1px solid var(--line-2);color:var(--cream);padding:0 10px;font-size:14.5px}
.painel .linha{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.painel .lim{margin-top:12px;font-size:13.5px;font-weight:700;color:var(--warn)}
.resumo{max-width:900px;margin:0 auto;padding:10px 16px 2px;display:flex;
  align-items:baseline;justify-content:space-between;gap:10px}
.resumo .qt{font-size:13.5px;color:var(--muted);font-weight:600}
.resumo .qt b{color:var(--gold-soft);font-size:16px}
.resumo .ord{font-size:13px;color:var(--muted);font-weight:700}

/* ---------- lista ---------- */
.lista{max-width:900px;margin:0 auto;padding:10px 16px 20px;display:grid;gap:10px}
/* O card da lista e' quase todo desenho: o professor reconhece o exercicio pela
   forma antes de ler o nome. O objetivo saiu daqui — ele esta' na ficha, e a
   busca continua achando por ele.
   O card INTEIRO abre a ficha. Antes so' o desenho e o texto abriam, e a
   borda de 10 px mais o vao de 12 px entre eles eram zona morta: o dedo caia
   ali e nao acontecia nada. O cursor:pointer nao e' enfeite — sem ele o
   Safari do iPhone nao manda o clique de um <div> subir ate' o document. */
.card{background:var(--navy-2);border:1px solid var(--line-2);border-radius:var(--r);
  padding:10px;display:flex;gap:12px;align-items:center;text-align:left;width:100%;
  cursor:pointer;
  scroll-margin-top:124px}   /* barra de cima + filtros: rolar ate' o card nao o esconde */
.card:active{background:var(--navy-3);border-color:var(--line)}
.card.no-plano{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(216,180,92,.25)}
.card .miniq{flex:0 0 104px;width:104px;border-radius:10px;overflow:hidden;
  background:var(--deep);border:1px solid var(--line-2);display:block;padding:0;
  position:static;height:auto}
.card .miniq svg{display:block;width:100%}
.card .mid{flex:1;min-width:0;align-self:center}
.card h3{font-size:16px;color:#fff;line-height:1.2;margin-bottom:7px}
.sinais{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sinal{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.sinal .ic{font-size:13px}
.sinal.min{color:var(--gold-soft)}
.sinal .cd{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--muted-2)}
/* Régua de nível: 5 pontos, acesos nos níveis que o exercício atende.
   Diz "do Base ao Topo" sem escrever "do Base ao Topo". */
.regua{display:flex;gap:3px;align-items:center}
.regua i{width:7px;height:7px;border-radius:50%;background:rgba(244,239,230,.16);display:block}
.regua i.on{background:var(--gold)}
.card .add{flex-shrink:0;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold-soft);align-self:center}
.card .add.dentro{background:var(--gold);color:#23303b;border-color:transparent}
@media(min-width:520px){ .card .miniq{flex-basis:132px;width:132px} .card h3{font-size:17px} }
.vazio{text-align:center;padding:44px 20px;color:var(--muted)}
.vazio .em{font-size:36px;margin-bottom:12px}
.vazio b{color:var(--gold-soft);display:block;margin-bottom:6px;font-size:17px}

/* ---------- formulário de exercício ---------- */
.ed-campo{margin-bottom:14px}
.ed-campo label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.ed-campo small{display:block;font-size:12px;color:var(--muted-2);margin-top:5px;line-height:1.4}
.ed-campo input,.ed-campo select,.ed-campo textarea{width:100%;background:var(--navy-2);
  border:1px solid var(--line-2);border-radius:11px;color:var(--cream);
  padding:11px 12px;font-size:15.5px;line-height:1.45;outline:none}
/* 16px e' o minimo: abaixo disso o Safari do iPhone da' zoom ao tocar no campo,
   e a tela fica torta ate' a pessoa fechar o teclado. O 15.5 acima vale para
   os campos de uma linha, que sao curtos; onde se escreve de verdade, 16. */
.ed-campo textarea{font-family:inherit;resize:vertical;font-size:16px}
.ed-campo input:focus,.ed-campo select:focus,.ed-campo textarea:focus{border-color:var(--gold)}
.ed-chips{display:flex;flex-wrap:wrap;gap:7px}
.ed-chips .chip{flex:0 0 auto}
.ed-dois{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed-erro{background:rgba(224,120,74,.12);border:1px solid rgba(224,120,74,.4);
  border-radius:11px;padding:11px 12px;font-size:14px;color:#F7D4C4;margin-bottom:14px}
.ed-erro[hidden]{display:none}
#edCorpo .qd-cx{margin-top:4px}

/* ---------- aula pronta ---------- */
/* Tema mais nivel ja' descrevem uma aula inteira. Em vez de deixar o professor
   montar a mao, a faixa mostra o que sairia — e um toque poe no plano. */
.pronta{max-width:900px;margin:0 auto;padding:11px 16px 0}
.pronta .cx{display:flex;align-items:center;gap:11px;
  background:linear-gradient(135deg,var(--navy-2),var(--navy-3));
  border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.pronta .tx{flex:1;min-width:0}
.pronta .tt{display:block;font-size:10px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold)}
.pronta .sub{display:block;font-size:14px;font-weight:700;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pronta .mini{display:block;font-size:11.5px;font-weight:600;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pronta .bt{display:flex;gap:7px;flex-shrink:0}
.pronta .bt button{height:40px;padding:0 13px;border-radius:11px;border:1px solid var(--line);
  font-size:14px;font-weight:800;color:var(--gold-soft);background:var(--deep)}
.pronta .bt button:active{transform:scale(.95)}
.pronta[hidden]{display:none}

/* ---------- barra de baixo ---------- */
.rodape{position:fixed;left:0;right:0;bottom:0;z-index:55;
  background:rgba(11,27,43,.98);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + var(--base))}
.rodape-in{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;
  font-size:15px;padding:13px 20px;border-radius:12px;border:2px solid transparent;flex:1}
.btn:active{transform:scale(.98)}
.btn-gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold-2));color:#23303b}
.btn-line{border-color:var(--line);color:var(--gold-soft)}
.btn-esc{background:var(--navy-2);border-color:var(--line-2);color:var(--cream)}
.btn:disabled{opacity:.45}
.btn.pq{padding:10px 15px;font-size:13.5px;flex:0 0 auto}

/* ---------- ficha e gaveta ---------- */
/* dvh e nao vh: no Safari do iPhone o vh conta a tela COM a barra de
   endereco escondida, entao a folha passava por baixo da barra de baixo do
   navegador e o botao "por no plano" ficava fora do alcance do dedo. */
.fundo{position:fixed;inset:0;height:100vh;height:100dvh;z-index:60;
  background:rgba(6,14,23,.72);display:none;align-items:flex-end;justify-content:center}
.fundo.aberto{display:flex}
/* overscroll-behavior:contain — chegando no fim da folha, o arrasto para ali
   em vez de continuar rolando a lista atras dela. */
.folha{background:var(--navy);width:100%;max-width:900px;max-height:92vh;max-height:88dvh;
  overflow-y:auto;overscroll-behavior:contain;
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding-bottom:calc(20px + var(--base));-webkit-overflow-scrolling:touch}
.folha-top{position:sticky;top:0;background:var(--navy);z-index:2;
  padding:14px 16px 12px;border-bottom:1px solid var(--line-2);display:flex;gap:12px;align-items:flex-start}
.folha-top .mid{flex:1;min-width:0}
.folha-top h2{font-size:20px;color:#fff}
.folha-top .cd{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
.fechar{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.folha-corpo{padding:16px}
.bloco-tx{margin-bottom:18px}
.bloco-tx .tt{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin-bottom:6px}
.bloco-tx p{font-size:15px;color:#E9E2D6}
.bloco-tx.destaque{background:var(--navy-2);border:1px solid var(--line);border-radius:12px;padding:14px}
.bloco-tx.alerta{background:rgba(224,120,74,.09);border:1px solid rgba(224,120,74,.3);
  border-radius:12px;padding:14px}
.bloco-tx.alerta .tt{color:var(--warn)}
.bloco-tx.ok{background:rgba(127,166,80,.09);border:1px solid rgba(127,166,80,.3);
  border-radius:12px;padding:14px}
.bloco-tx.ok .tt{color:var(--ok)}
.prog{display:grid;gap:8px}
.prog .it{display:flex;gap:11px;background:var(--navy-2);border:1px solid var(--line-2);
  border-radius:11px;padding:11px 13px}
.prog .it.foco{border-color:var(--gold);background:rgba(216,180,92,.08)}
.prog .nv{flex-shrink:0;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gold-soft);width:86px;padding:3px 6px 0 0}
.prog .tx{flex:1;font-size:14px;color:#E9E2D6}
.ficha-meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.meta{background:var(--navy-2);border:1px solid var(--line-2);border-radius:11px;padding:10px 12px}
.meta .k{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2)}
.meta .v{font-size:14px;font-weight:700;color:#fff;margin-top:3px}
.folha-acoes{display:flex;gap:9px;padding:0 16px 8px;position:sticky;bottom:0;background:var(--navy);
  padding-top:12px;border-top:1px solid var(--line-2)}

/* ---------- card de treino: o desenho e o passo a passo ---------- */
.qd-cx{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:16px;background:#0E2337}
.qd{display:block;width:100%}
.qd-leg{display:flex;flex-wrap:wrap;gap:7px 13px;padding:9px 11px;background:var(--navy-2);
  font-size:10.5px;color:var(--muted);border-top:1px solid var(--line-2)}
.qd-leg span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.qd-leg i{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.qd-leg i.tr{width:14px;height:3px;border-radius:2px}
.qd-leg i.cn{width:0;height:0;border-radius:0;background:none!important;
  border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:9px solid var(--warn)}
.qd-leg i.zn{width:12px;height:9px;border-radius:2px;border:1px dashed var(--gold);background:rgba(216,180,92,.2)}
/* quando o papel tem foto, a legenda mostra o rosto — o recorte e' de corpo
   inteiro, entao a bolinha pega o alto da imagem */
.qd-leg i.rosto{width:16px;height:16px;background-size:340%;background-position:50% 4%;
  background-repeat:no-repeat;border:1px solid var(--line-2)}
/* A frase que conta o que o desenho mostra. Existe para os 116 exercicios e
   estava so' no aria-label, invisivel para quem enxerga. */
.qd-desc{font-size:14.5px;line-height:1.5;color:#F0E9DC;padding:12px;
  background:rgba(216,180,92,.08);border-top:1px solid var(--line-2)}
.qd-nota{font-size:12.5px;color:var(--muted);padding:9px 11px;background:var(--deep);
  border-top:1px solid var(--line-2);line-height:1.45}

.passos{counter-reset:passo;display:grid;gap:8px}
.passos li{list-style:none;display:flex;gap:11px;background:var(--navy-2);
  border:1px solid var(--line-2);border-radius:11px;padding:11px 13px}
.passos li::before{counter-increment:passo;content:counter(passo);flex-shrink:0;
  width:22px;height:22px;border-radius:7px;background:var(--gold);color:#22303c;
  font-size:12.5px;font-weight:900;display:flex;align-items:center;justify-content:center}
.passos li span{font-size:14.5px;color:#E9E2D6;line-height:1.5}
.bloco-tx.dica{background:rgba(216,180,92,.1);border:1px solid var(--line);border-radius:12px;padding:14px}
/* Faixa de sinais da ficha: tudo o que antes eram quatro caixas de texto. */
.sinais-ficha{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 14px;background:var(--navy-2);border:1px solid var(--line-2);
  border-radius:12px;margin-bottom:16px}
.sinais-ficha .s{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:#E9E2D6}
.sinais-ficha .s .ic{font-size:15px}
.sinais-ficha .s small{font-size:10px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted-2);display:block;margin-bottom:1px}
.sinais-ficha .s div{line-height:1.2}
.forca{display:flex;gap:3px;align-items:flex-end;height:14px}
.forca i{width:5px;border-radius:1px;background:rgba(244,239,230,.18);display:block}
.forca i:nth-child(1){height:6px} .forca i:nth-child(2){height:10px} .forca i:nth-child(3){height:14px}
.forca.baixa i:nth-child(1),
.forca.media i:nth-child(1),.forca.media i:nth-child(2),
.forca.alta i{background:var(--gold)}

/* Objetivo: a frase que manda na ficha. Sem caixa, em corpo maior. */
.objetivo{font-size:17.5px;line-height:1.45;color:#fff;font-weight:600;
  margin:0 2px 18px;letter-spacing:-.01em}
.objetivo b{color:var(--gold-soft);font-weight:700}

/* As três colunas viram abas: uma por vez, em vez de três blocos empilhados. */
.abas{display:flex;gap:6px;margin-bottom:10px}
.abas button{flex:1;padding:10px 6px;border-radius:11px;border:1px solid var(--line-2);
  background:var(--navy-2);font-size:12.5px;font-weight:700;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px}
.abas button .ic{font-size:14px}
.abas button.on{background:rgba(216,180,92,.13);border-color:var(--gold);color:var(--gold-soft)}
.painel-aba{display:none;background:var(--navy-2);border:1px solid var(--line-2);
  border-radius:12px;padding:13px 15px;margin-bottom:18px}
.painel-aba.on{display:block}
.painel-aba ul{list-style:none;display:grid;gap:7px}
.painel-aba li{font-size:14.5px;color:#E3DCD0;padding-left:15px;position:relative;line-height:1.45}
.painel-aba li::before{content:"•";position:absolute;left:2px;color:var(--muted-2);font-weight:900}
.painel-aba li.primeiro{color:#fff;font-weight:600}
.painel-aba li.primeiro::before{content:"!";color:var(--warn);font-weight:900;left:4px}

/* O que não é essencial fica a um toque, não empilhado na rolagem. */
.gaveta{border:1px solid var(--line-2);border-radius:12px;background:var(--navy-2);
  margin-bottom:10px;padding:0 14px}
.gaveta summary{cursor:pointer;list-style:none;min-height:48px;display:flex;align-items:center;
  gap:9px;font-size:14px;font-weight:700;color:#E9E2D6}
.gaveta summary::-webkit-details-marker{display:none}
.gaveta summary::after{content:"+";margin-left:auto;color:var(--gold);font-weight:800;font-size:19px}
.gaveta[open] summary::after{content:"–"}
.gaveta .dentro{padding:2px 0 14px}
.gaveta .dentro p{font-size:14px;color:var(--muted);margin-bottom:8px}
.gaveta .dentro p b{color:var(--gold-soft)}

.colunas{display:grid;gap:11px;margin-bottom:18px}
.col{background:var(--navy-2);border:1px solid var(--line-2);border-radius:12px;padding:13px 14px}
.col .tt{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  margin-bottom:8px;display:flex;align-items:center;gap:6px}
.col.foco{border-color:rgba(127,166,80,.35)} .col.foco .tt{color:var(--ok)}
.col.err{border-color:rgba(224,120,74,.35)} .col.err .tt{color:var(--warn)}
.col.dif{border-color:var(--line)}          .col.dif .tt{color:var(--gold-soft)}
.col ul{list-style:none;display:grid;gap:6px}
.col li{font-size:13.5px;color:#E3DCD0;padding-left:14px;position:relative;line-height:1.45}
.col li::before{content:"•";position:absolute;left:2px;color:var(--muted-2);font-weight:900}
.col.err li.primeiro{color:#fff;font-weight:600}
.col.err li.primeiro::before{content:"1";color:var(--warn);font-size:11px;top:1px}
.col.err li.primeiro em{display:block;font-style:normal;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--warn);margin-top:3px}
@media(min-width:620px){ .colunas{grid-template-columns:repeat(3,1fr)} }
.bloco-tx.dica .tt{color:var(--gold-soft)}

/* ---------- plano de aula ---------- */
.plano-vazio{text-align:center;padding:30px 16px;color:var(--muted)}
.plano-cab{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.plano-cab input,.plano-cab select{width:100%;height:42px;border-radius:11px;background:var(--navy-2);
  border:1px solid var(--line-2);color:var(--cream);padding:0 11px;font-size:14.5px;outline:none}
.pb{margin-bottom:16px}
.pb-tt{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pb-tt h3{font-size:14.5px;color:var(--gold-soft)}
.pb-tt .tp{font-size:11.5px;color:var(--muted-2);font-weight:700;margin-left:auto}
.pi{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--navy-2);
  border:1px solid var(--line-2);border-radius:11px;padding:10px 12px;margin-bottom:7px}
.pi .cd{font-size:11px;font-weight:900;color:var(--gold);width:38px;flex-shrink:0}
.pi .nm{flex:1;font-size:14.5px;font-weight:600;min-width:0}
/* o tempo e' um campo, nao um rotulo: o professor corta 10 para 7 quando a
   aula aperta, e ate' agora tinha que tirar o exercicio inteiro para isso */
.pi .mn{width:62px;flex-shrink:0;background:var(--deep);border:1px solid var(--line-2);
  border-radius:8px;color:var(--gold-soft);font-size:13.5px;font-weight:800;
  padding:6px 4px 6px 8px;text-align:left}
/* os botoes descem para uma fila propria: em 390 px nao cabiam na mesma linha
   do nome sem espremer o nome ate' a ilegibilidade */
.pi .acs{flex-basis:100%;display:flex;gap:7px;justify-content:flex-end;
  border-top:1px solid var(--line-2);padding-top:8px}
.pi .acs button{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);
  font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:4px}
.pi .acs button:active{background:var(--navy-3)}
.pi .x{color:var(--warn)}
.pi .mv{width:34px;justify-content:center}
.pb-mais{width:100%;height:40px;border-radius:10px;border:1px dashed var(--line);
  color:var(--gold-soft);font-size:13.5px;font-weight:700;margin-bottom:10px}
.pb.falta .pb-tt h3::after{content:" — vazio";color:var(--warn);font-weight:700}
.total{display:flex;align-items:center;justify-content:space-between;background:var(--deep);
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:14px}
.total .n{font-size:24px;font-weight:900;color:var(--gold-soft)}
.total .l{font-size:12.5px;color:var(--muted);font-weight:700;text-align:right}
.auto{background:rgba(216,180,92,.08);border:1px dashed var(--line);border-radius:12px;
  padding:13px 14px;margin-bottom:16px}
.auto p{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.auto .ln{display:flex;gap:8px}
.aviso{font-size:13px;color:var(--ok);font-weight:700;text-align:center;padding:8px 0}

@media(min-width:620px){
  .lista{grid-template-columns:1fr 1fr}
  .ficha-meta{grid-template-columns:repeat(4,1fr)}
  .folha{border-radius:20px;max-height:88vh;margin-bottom:4vh}
  .fundo{align-items:center}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- impressão: sai só o plano de aula, em preto no branco ------
   A tela é escura; o papel não. Aqui tudo que é "cinza bonito" na tela vira
   preto legível, e as outras gavetas (ficha, tema do mês) não vão para o
   papel — mesmo que tenham sido abertas antes. */
.det, .cab-imp, .imprimivel{display:none}
@media print{
  html,body{background:#fff!important;color:#000!important;padding:0;margin:0}
  header.bar,.foco,.tira,.filtros,.resumo,.pronta,.lista,.rodape,.folha-acoes,.auto,
  .pi .acs,.pb-mais,.fechar,.plano-cab,
  #fundoFicha,#fundoMes,#fundoMeus,#fundoEditor,#fundoEscolher{display:none!important}
  /* o campo de minutos vira texto no papel: caixa de formulário impressa fica
     com borda e seta de setinha, que não é o que vai para a quadra */
  .pi .mn{border:none;background:none;color:#000;font-weight:800;width:auto;
    padding:0;-webkit-appearance:none;appearance:none}
  #fundoPlano{position:static;display:block;background:none;inset:auto}
  #fundoPlano .folha{max-height:none;overflow:visible;background:#fff;border:none;
    max-width:100%;border-radius:0;margin:0;padding:0}
  #fundoPlano .folha-top{position:static;background:#fff;border-bottom:2px solid #222;padding:0 0 8px}
  #fundoPlano .folha-corpo{padding:0}
  .folha-top h2{color:#000;font-size:19px}
  .folha-top .cd{color:#555}
  .cab-imp{display:block;font-size:12.5px;color:#000;margin:10px 0 14px;line-height:1.9}
  .cab-imp span{display:inline-block;margin-right:22px}
  .cab-imp b{font-weight:800}
  .total{background:#fff;border:1px solid #444;color:#000;padding:8px 12px;margin-bottom:14px}
  .total .n{color:#000;font-size:18px}
  .total .l{color:#333;font-size:11.5px}
  .pb{margin-bottom:12px;page-break-inside:avoid}
  .pb-tt h3{color:#000;font-size:14px}
  .pb-tt .tp{color:#333;font-size:11px}
  .pi{background:#fff;border:1px solid #999;color:#000;display:block;
    padding:8px 11px;margin-bottom:6px;page-break-inside:avoid}
  .pi .cd{color:#000;font-weight:800;width:auto;font-size:11.5px}
  .pi .nm{color:#000;font-weight:800;font-size:13.5px;display:inline;padding:0 6px}
  .pi .mn{color:#000;font-size:11.5px;font-weight:700}
  .det{display:flex;gap:9px;align-items:flex-start;font-size:11px;color:#111;margin-top:6px;line-height:1.45}
  /* o desenho manda pela ALTURA, não pela largura: a quadra inteira é um retrato
     comprido e, medida pela largura, empurrava cada exercício para meia página */
  .det-qd{flex:0 0 auto;border:1px solid #bbb;border-radius:3px;overflow:hidden}
  /* Largura fixa, altura natural: agora que o desenho enquadra a ação, cada um
     tem uma proporção própria — mandar pela altura deixava uns largos e outros
     estreitos na mesma folha. Pela largura, a coluna do desenho fica alinhada. */
  .det-qd svg{width:44mm;height:auto;display:block}
  .det-qd svg>rect:first-of-type{fill:#fff}   /* moldura escura não vai para o papel */
  .det-tx{flex:1;min-width:0}
  .det b{font-weight:800}
  .det i{color:#333;font-style:normal}
  .det-pa{margin:2px 0 4px 15px;padding:0}
  .det-pa li{margin-bottom:1px}
  .det-col{margin:3px 0;padding:4px 0;border-top:1px solid #ddd;border-bottom:1px solid #ddd}
  .det-col div{margin-bottom:1px}
  .bloco-tx{margin-bottom:10px}
  .bloco-tx .tt{color:#000}
  .bloco-tx p{color:#111!important;font-size:11.5px}
  .imprimivel{display:block;font-size:10.5px;color:#444;margin-top:12px;
    border-top:1px solid #999;padding-top:6px}
}
</style>
</head>
<body>

<header class="bar"><div class="wrap bar-in">
  <div class="brand">
    <span class="mono">JV</span>
    <span class="nm">Banco de Exercícios<small>Da Base ao Topo</small></span>
  </div>
  <span class="espaco"></span>
  <button class="ico-btn" id="btnMeus" title="Meus exercícios" aria-label="Meus exercícios">✎</button>
  <button class="ico-btn" id="btnFav" title="Ver só os favoritos" aria-label="Ver só os favoritos">☆</button>
  <button class="ico-btn" id="btnPlano" title="Plano de aula" aria-label="Plano de aula">📋<span class="selo" id="seloPlano" hidden>0</span></button>
</div></header>

<section class="foco"><div class="wrap linha-mes">
  <div class="tx">
    <span class="et" id="focoEt">Foco do mês</span>
    <h1 id="focoTema">—</h1>
  </div>
  <button class="ver" id="focoVer" aria-label="O que este mês trabalha">i</button>
</div></section>

<nav class="tira centro" id="tiraTemas" aria-label="Tema do mês"></nav>

<div class="filtros">
  <div class="busca-linha">
    <div class="busca">
      <span aria-hidden="true">🔎</span>
      <label class="sr" for="q">Buscar exercício</label>
      <input id="q" type="search" placeholder="Buscar exercício" autocomplete="off">
    </div>
    <button class="mais" id="btnMais" aria-expanded="false">Filtros</button>
  </div>
  <nav class="tira centro" id="tiraNiveis" aria-label="Nível do aluno"></nav>
  <div class="painel" id="painel">
    <nav class="tira" id="tiraBlocos" style="padding:0 0 4px" aria-label="Bloco da aula"></nav>
    <div class="gr">
      <div class="campo"><label for="fNec">Necessidade do aluno</label>
        <select id="fNec"><option value="">Qualquer necessidade</option></select></div>
      <div class="campo"><label for="fForm">Formato da aula</label>
        <select id="fForm"><option value="">Qualquer formato</option></select></div>
      <div class="campo"><label for="fCam">Camada da Pirâmide</label>
        <select id="fCam"><option value="">Qualquer camada</option></select></div>
      <div class="campo"><label for="fMat">Material disponível</label>
        <select id="fMat"><option value="">Tenho qualquer material</option></select></div>
      <div class="campo"><label for="fInt">Intensidade</label>
        <select id="fInt"><option value="">Qualquer intensidade</option>
          <option value="baixa">Baixa</option><option value="media">Média</option><option value="alta">Alta</option></select></div>
      <div class="campo"><label for="fOrd">Ordenar por</label>
        <select id="fOrd"><option value="tema">Ordem do banco</option>
          <option value="curto">Mais curtos primeiro</option>
          <option value="longo">Mais longos primeiro</option>
          <option value="nome">Nome (A–Z)</option></select></div>
    </div>
    <div class="linha">
      <button class="chip" id="cApostila">Só os da apostila</button>
      <button class="chip" id="cMeus">Só os meus</button>
      <button class="chip" id="cTransv">Esconder transversais</button>
    </div>
    <button class="lim" id="btnLimpar">✕ limpar todos os filtros</button>
  </div>
</div>

<section class="pronta" id="pronta"><div class="cx">
  <div class="tx">
    <span class="tt">⚡ Aula pronta</span>
    <span class="sub" id="prontaSub">—</span>
    <span class="mini" id="prontaMini">—</span>
  </div>
  <div class="bt">
    <button id="pronta60" aria-label="Montar aula de 60 minutos">60′</button>
    <button id="pronta90" aria-label="Montar aula de 90 minutos">90′</button>
  </div>
</div></section>

<div class="resumo">
  <span class="qt" id="qt">—</span>
  <span class="ord" id="ordAviso"></span>
</div>

<main class="lista" id="lista"></main>

<div class="rodape"><div class="rodape-in">
  <button class="btn btn-esc" id="btnMontar">⚡ Montar aula</button>
  <button class="btn btn-gold" id="btnVerPlano">📋 Plano <span id="planoQt">(0)</span></button>
</div></div>

<!-- ficha do exercício -->
<div class="fundo" id="fundoFicha" role="dialog" aria-modal="true" aria-labelledby="fichaNome">
  <div class="folha" id="folhaFicha"></div>
</div>

<!-- plano de aula -->
<div class="fundo" id="fundoPlano" role="dialog" aria-modal="true" aria-labelledby="planoTitulo">
  <div class="folha">
    <div class="folha-top">
      <div class="mid">
        <span class="cd">Plano de aula</span>

<!-- explicação do mês -->

    <div class="folha-top">
      <div class="mid"><span class="cd" id="escCod">bloco</span><h2 id="escTitulo">Escolher</h2></div>
      <button class="fechar" data-fecha="fundoEscolher" aria-label="Fechar">✕</button>

    <div class="folha-corpo" id="escCorpo"></div>

      <button class="fechar" data-fecha="fundoMes" aria-label="Fechar">✕</button>

    <div class="folha-corpo" id="mesCorpo"></div>

<script src="quadra.js"></script>
<script src="exercicios.js"></script>
<script>
'use strict';

/* ==========================================================================
   ESTADO. Tudo que a tela precisa saber cabe aqui.
   ========================================================================== */
var F = {                      // filtros
  tema:'', niveis:[], blocos:[], nec:'', form:'', cam:'', mat:'', int:'',
  q:'', ord:'tema', apostila:false, meus:false, semTransv:false, favs:false
};
var MEUS = [];                 // exercícios criados pelo professor, neste aparelho
var BANCO = [];                // os 116 do banco + os MEUS, que é o que a tela usa
var FAV = [];                  // ids favoritados
var ABA = 'foco';              // aba visível nas três colunas da ficha
var PLANO = { aluno:'', nivel:'', tema:'', itens:[] };   // itens: [{id, bloco}]
var CH_FAV = 'jvex:favoritos', CH_PLANO = 'jvex:plano', CH_MEUS = 'jvex:meus';

/* O banco de verdade é a soma dos dois. EX é const (vem de exercicios.js e é a
   parte que não se edita no celular); MEUS fica no aparelho. Tudo na tela lê
   BANCO, para um exercício criado aqui valer em tudo: busca, filtro, plano,
   aula pronta e impressão. */
function montarBanco(){
  BANCO = EX.concat(MEUS);
}
function acharEx(id){
  for (var i = 0; i < BANCO.length; i++) if (BANCO[i].id === id) return BANCO[i];
  return null;
}

function guardar(chave, valor){
  try { localStorage.setItem(chave, JSON.stringify(valor)); } catch(e){}
}
function ler(chave, reserva){
  try {
    var v = localStorage.getItem(chave);
    return v ? JSON.parse(v) : reserva;
  } catch(e){ return reserva; }
}
function esc(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function el(id){ return document.getElementById(id); }

/* ==========================================================================
   FILTRO
   ========================================================================== */
function passa(e){
  if (F.tema && e.tema.indexOf(F.tema) < 0) return false;
  if (F.semTransv && e.transv) return false;
  if (F.niveis.length && !F.niveis.some(function(n){ return e.niveis.indexOf(n) >= 0; })) return false;
  if (F.blocos.length && F.blocos.indexOf(e.bloco) < 0) return false;
  if (F.nec && e.nec.indexOf(F.nec) < 0) return false;
  if (F.form && e.form.indexOf(F.form) < 0) return false;
  if (F.cam && e.camada !== Number(F.cam)) return false;
  if (F.int && e.int !== F.int) return false;
  if (F.apostila && e.fonte !== 'apostila') return false;
  if (F.meus && e.fonte !== 'meu') return false;
  if (F.favs && FAV.indexOf(e.id) < 0) return false;
  // "material disponível": o exercício precisa caber no que o professor tem
  if (F.mat) {
    var so = e.mat.filter(function(m){ return m !== 'nada'; });
    if (so.length && so.indexOf(F.mat) < 0) return false;
  }
  if (F.q) {
    var t = F.q.toLowerCase();
    var alvo = [e.id, e.nome, e.objetivo, e.execucao, e.montagem, e.erro, e.sucesso]
      .join(' ').toLowerCase();
    var tags = e.nec.map(function(n){ var x = necessidade(n); return x ? x.nome : ''; }).join(' ').toLowerCase();
    if (alvo.indexOf(t) < 0 && tags.indexOf(t) < 0) return false;
  }
  return true;
}

function filtrados(){
  var r = BANCO.filter(passa);
  if (F.ord === 'curto') r.sort(function(a,b){ return a.min - b.min; });
  else if (F.ord === 'longo') r.sort(function(a,b){ return b.min - a.min; });
  else if (F.ord === 'nome') r.sort(function(a,b){ return a.nome.localeCompare(b.nome,'pt-BR'); });
  return r;
}

/* ==========================================================================
   DESENHO DA TELA
   ========================================================================== */
function desenharFoco(){
  var t = F.tema ? tema(F.tema) : temaDoMes();
  var doMes = temaDoMes();
  var c = camada(t.camada);
  el('focoEt').textContent = (t.id === doMes.id ? MESES_NOME[new Date().getMonth()] + ' · foco do mês'
                                                 : t.mesesTx + ' · tema escolhido');

}

function desenharTemas(){

  TEMAS.forEach(function(t){

function desenharNiveis(){

function desenharBlocos(){

function preencherSelects(){

/* Régua de níveis: 5 pontos, acesos onde o exercício serve. */
function reguaNiveis(e){
  var pontos = NIVEIS.map(function(n){
    return '<i class="' + (e.niveis.indexOf(n.id) >= 0 ? 'on' : '') + '"></i>';

function cartao(e){

function desenharLista(){
  var r = filtrados();

  el('qt').innerHTML = '<b>' + r.length + '</b> ' + (r.length === 1 ? 'exercício' : 'exercícios') +

function marcarChips(){
  el('cApostila').classList.toggle('on', F.apostila);

  el('cTransv').classList.toggle('on', F.semTransv);
  el('btnFav').textContent = F.favs ? '★' : '☆';

function atualizar(){

  marcarChips(); desenharLista(); desenharPronta(); selo();
}

/* ==========================================================================
   FICHA DO EXERCÍCIO
   ========================================================================== */
function abrirFicha(id){
  var e = acharEx(id);
  if (!e) return;
  var c = camada(e.camada), b = bloco(e.bloco);
  var focos = F.niveis.slice();
  var dentro = PLANO.itens.some(function(i){ return i.id === e.id; });
  var intTx = { baixa:'Baixa', media:'Média', alta:'Alta' }[e.int];

  var prog = NIVEIS.filter(function(n){ return e.prog && e.prog[n.id]; }).map(function(n){
    return '<div class="it' + (focos.indexOf(n.id) >= 0 ? ' foco' : '') + '">' +
      '<span class="nv">' + esc(n.nome) + '</span>' +
      '<span class="tx">' + esc(e.prog[n.id]) + '</span></div>';
  }).join('');

  var mats = e.mat.map(function(m){ var x = material(m); return x ? x.nome : m; }).join(' · ');
  var necs = e.nec.map(function(n){ var x = necessidade(n); return x ? x.nome : n; }).join(' · ');
  var forms = e.form.map(function(f){ var x = formato(f); return x ? x.nome : f; }).join(' · ');
  var temas = e.tema.map(function(t){ var x = tema(t); return x ? x.nome : t; }).join(' · ');

  function lista(itens, classePrimeiro){
    return '<ul>' + itens.map(function(t, i){
      return '<li' + (i === 0 && classePrimeiro ? ' class="primeiro"' : '') + '>' + esc(t) + '</li>';
    }).join('') + '</ul>';
  }

  el('folhaFicha').innerHTML = '' +
  '<div class="folha-top">' +
    '<div class="mid">' +
      '<span class="cd" style="color:' + c.cor + '">' + esc(e.id) + ' · ' + b.icone + ' ' + esc(b.nome) + '</span>' +
      '<h2 id="fichaNome">' + esc(e.nome) + '</h2>' +
    '</div>' +
    '<button class="fechar" data-fecha="fundoFicha" aria-label="Fechar">✕</button>' +
  '</div>' +
  '<div class="folha-corpo">' +

    // 1. o desenho manda: e' a primeira coisa que aparece, e logo abaixo dele
    //    a frase que conta o que esta' desenhado — sem ela o professor tinha
    //    que deduzir a cena a partir das bolinhas e das setas.
    '<div class="qd-cx">' + svgQuadra(e.fig) +
      (e.fig && e.fig.nota ? '<div class="qd-desc">' + esc(e.fig.nota) + '</div>' : '') +
      '<div class="qd-nota"><b>Montagem:</b> ' + esc(e.montagem) + '</div>' +
      legendaQuadra() + '</div>' +

    // 2. os dados da atividade, numa faixa so'
    '<div class="sinais-ficha">' +
      '<span class="s"><span class="ic">⏱</span><div><small>duração</small>' + e.min + ' min</div></span>' +
      '<span class="s"><span class="forca ' + e.int + '" role="img" aria-label="Intensidade ' + intTx + '">' +
        '<i></i><i></i><i></i></span><div><small>intensidade</small>' + intTx + '</div></span>' +
      '<span class="s"><span class="ic">👥</span><div><small>jogadores</small>' + quantosJogadores(e) + '</div></span>' +
      '<span class="s"><div><small>níveis</small>' + reguaNiveis(e) + '</div></span>' +
    '</div>' +

    // 3. uma frase: o para quê
    '<p class="objetivo">' + esc(e.objetivo) + '</p>' +

    // 3b. escolheu nível na tira? a versão dele vem para cima, em vez de
    //     ficar guardada na gaveta "o mesmo exercício em cada nível".
    focos.filter(function(n){ return e.prog && e.prog[n]; }).map(function(n){
      return '<div class="bloco-tx destaque"><div class="tt">📶 No nível ' +
        esc(nivel(n).nome) + '</div><p>' + esc(e.prog[n]) + '</p></div>';
    }).join('') +

    // 4. o passo a passo, que e' o que se le em quadra
    '<div class="bloco-tx"><div class="tt">Como aplicar</div><ol class="passos">' +
      (e.passos || []).map(function(t){ return '<li><span>' + esc(t) + '</span></li>'; }).join('') +
    '</ol></div>' +
    (e.dica ? '<div class="bloco-tx dica"><div class="tt">💡 Dica extra</div><p>' + esc(e.dica) + '</p></div>' : '') +

    // 5. as tres colunas, uma por vez
    '<div class="abas">' +
      '<button data-aba="foco" class="' + (ABA === 'foco' ? 'on' : '') + '"><span class="ic">✅</span>Foco</button>' +
      '<button data-aba="err" class="' + (ABA === 'err' ? 'on' : '') + '"><span class="ic">⚠️</span>Erros</button>' +
      '<button data-aba="dif" class="' + (ABA === 'dif' ? 'on' : '') + '"><span class="ic">📈</span>Dificultar</button>' +
    '</div>' +
    '<div class="painel-aba' + (ABA === 'foco' ? ' on' : '') + '" data-painel="foco">' + lista(e.foco || []) + '</div>' +
    '<div class="painel-aba' + (ABA === 'err' ? ' on' : '') + '" data-painel="err">' +
      lista([e.erro].concat(e.erros || []), true) + '</div>' +
    '<div class="painel-aba' + (ABA === 'dif' ? ' on' : '') + '" data-painel="dif">' + lista(e.dificultar || []) + '</div>' +

    // 6. o criterio: uma linha, em destaque
    '<div class="bloco-tx ok"><div class="tt">Funcionou se</div><p>' + esc(e.sucesso) + '</p></div>' +

    // 7. o resto fica guardado
    '<details class="gaveta"><summary>📶 O mesmo exercício em cada nível</summary>' +
      '<div class="dentro"><div class="prog">' + prog + '</div></div></details>' +
    (e.kids ? '<details class="gaveta"><summary>🧒 Versão Kids</summary>' +
      '<div class="dentro"><p>' + esc(e.kids) + '</p></div></details>' : '') +
    '<details class="gaveta"><summary>🎒 Material, formatos e tema</summary>' +
      '<div class="dentro">' +
        '<p><b>Material:</b> ' + esc(mats) + '</p>' +
        '<p><b>Formatos:</b> ' + esc(forms) + '</p>' +
        '<p><b>Serve para:</b> ' + esc(necs) + '</p>' +
        '<p><b>Tema do mês:</b> ' + esc(temas) + (e.transv ? ' — serve em qualquer mês' : '') + '</p>' +
        '<p><b>Origem:</b> ' + (e.fonte === 'apostila' ? 'drill da apostila'
          : e.fonte === 'meu' ? 'exercício seu — dá para editar em ✎ Meus exercícios'
          : 'ampliação do banco') + '</p>' +
      '</div></details>' +
  '</div>' +
  '<div class="folha-acoes">' +
    '<button class="btn btn-esc pq" data-favorito="' + e.id + '">' + (FAV.indexOf(e.id) >= 0 ? '★' : '☆') + '</button>' +
    '<button class="btn btn-gold" data-add="' + e.id + '">' + (dentro ? '✓ no plano — tirar' : '+ pôr no plano') + '</button>' +
  '</div>';
  abrir('fundoFicha');
}

/* Aba visível nas três colunas. Fica guardada enquanto o app está aberto, para
   quem usa sempre a mesma não precisar escolher em cada exercício. */
function trocarAba(qual){
  ABA = qual;
  var folha = el('folhaFicha');
  folha.querySelectorAll('[data-aba]').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-aba') === qual);
  });
  folha.querySelectorAll('[data-painel]').forEach(function(d){
    d.classList.toggle('on', d.getAttribute('data-painel') === qual);
  });
}

/* Quantos alunos a atividade comporta — derivado dos formatos que ela atende,
   para não ter que repetir a informação em cada exercício. */
function quantosJogadores(e){
  if (e.form.length === 1 && e.form[0] === 'kids') return 'turma';
  var max = 1;
  if (e.form.indexOf('dupla') >= 0) max = 2;
  if (e.form.indexOf('trio') >= 0 || e.form.indexOf('kids') >= 0) max = 4;
  return max === 1 ? '1 aluno' : '1 a ' + max;
}

/* ==========================================================================
   PLANO DE AULA
   ========================================================================== */
function noPlano(id){
  var i = PLANO.itens.map(function(x){ return x.id; }).indexOf(id);
  if (i >= 0) PLANO.itens.splice(i, 1);
  else {
    var e = acharEx(id);
    if (e) PLANO.itens.push({ id:id, bloco:e.bloco });
    // o primeiro exercicio define o tema do plano
    if (!PLANO.tema) PLANO.tema = F.tema || temaDoMes().id;
  }
  if (!PLANO.itens.length) PLANO.tema = '';
  guardar(CH_PLANO, PLANO);
  atualizar();
  if (el('fundoPlano').classList.contains('aberto')) desenharPlano();
  if (el('fundoFicha').classList.contains('aberto')) abrirFicha(id);
}

function mover(id, passo){
  var ids = PLANO.itens.map(function(x){ return x.id; });
  var i = ids.indexOf(id);
  if (i < 0) return;
  var mesmoBloco = PLANO.itens.filter(function(x){ return x.bloco === PLANO.itens[i].bloco; });
  var pos = mesmoBloco.map(function(x){ return x.id; }).indexOf(id) + passo;
  if (pos < 0 || pos >= mesmoBloco.length) return;
  var alvo = mesmoBloco[pos].id, j = ids.indexOf(alvo);
  var tmp = PLANO.itens[i]; PLANO.itens[i] = PLANO.itens[j]; PLANO.itens[j] = tmp;
  guardar(CH_PLANO, PLANO);
  desenharPlano();
}

function itensDoBloco(b){
  return PLANO.itens.filter(function(i){ return i.bloco === b; })
    .map(function(i){ return acharEx(i.id); })
    .filter(Boolean);
}

/* Minutos deste exercício NESTA aula: o professor pode encurtar sem mexer no
   banco. O i.min só existe quando ele mudou; sem isso vale o do exercício.
   Um id não se repete dentro de um plano, então procurar por id é seguro. */
function minNoPlano(id){
  var e = acharEx(id);
  if (!e) return 0;
  var i = PLANO.itens.filter(function(x){ return x.id === id; })[0];
  return i && typeof i.min === 'number' && i.min > 0 ? i.min : e.min;
}

function totalMin(){
  return PLANO.itens.reduce(function(s, i){ return s + minNoPlano(i.id); }, 0);
}

function mudarMin(id, valor){
  var n = Math.max(1, Math.min(60, Math.round(Number(valor) || 0)));
  PLANO.itens.forEach(function(i){
    if (i.id !== id) return;
    var e = acharEx(id);
    if (e && n === e.min) delete i.min; else i.min = n;
  });
  guardar(CH_PLANO, PLANO);
  // só o total é redesenhado: redesenhar a folha inteira tirava o foco do
  // campo e fechava o teclado do celular no meio da digitação
  var t = el('planoTotal');
  if (t) t.textContent = totalMin() + ' min';
}

function selo(){
  var n = PLANO.itens.length;
  el('seloPlano').hidden = n === 0;
  el('seloPlano').textContent = n;
  el('planoQt').textContent = '(' + n + ')';
}

function temaDoPlano(){
  return (PLANO.tema && tema(PLANO.tema)) || (F.tema ? tema(F.tema) : temaDoMes());
}

function desenharPlano(){
  var t = temaDoPlano();
  var h = '';
  h += '<div class="plano-cab">' +
    '<input id="pAluno" placeholder="Nome do aluno / turma" value="' + esc(PLANO.aluno) + '">' +
    '<select id="pNivel"><option value="">Nível do aluno</option>' +
      NIVEIS.map(function(n){ return '<option value="' + n.id + '"' + (PLANO.nivel === n.id ? ' selected' : '') +
        '>' + esc(n.nome) + ' (grupo ' + n.grupo + ')</option>'; }).join('') +
    '</select></div>';

  // linha que só existe no papel: os campos digitados não saem na impressão
  var nvImp = PLANO.nivel ? nivel(PLANO.nivel) : null;
  h += '<div class="cab-imp">' +
    '<span><b>Aluno/turma:</b> ' + (PLANO.aluno ? esc(PLANO.aluno) : '______________________') + '</span>' +
    '<span><b>Nível:</b> ' + (nvImp ? esc(nvImp.nome) + ' (grupo ' + nvImp.grupo + ')' : '____________') + '</span>' +
    '<span><b>Data:</b> ____/____/______</span>' +
    '<span><b>Tema do mês:</b> ' + esc(t.nome) + ' · ' + esc(t.mesesTx) + '</span></div>';

  if (!PLANO.itens.length) {
    h += '<div class="auto"><p><b style="color:var(--gold-soft)">Plano vazio.</b><br>' +
      'Monte na mão pelo “+” de cada exercício, ou deixe o app montar uma aula do tema do mês.</p>' +
      '<div class="ln"><button class="btn btn-gold pq" id="pAuto60">⚡ Aula de 60 min</button>' +
      '<button class="btn btn-line pq" id="pAuto90">90 min</button></div></div>';
  } else {
    var tot = totalMin();
    h += '<div class="total"><span class="n" id="planoTotal">' + tot + ' min</span>' +
      '<span class="l">' + PLANO.itens.length + ' exercícios<br>' + esc(t.nome) + '</span></div>';
  }

  BLOCOS.forEach(function(b){
    var itens = itensDoBloco(b.id);
    h += '<div class="pb' + (PLANO.itens.length && !itens.length ? ' falta' : '') + '">' +
      '<div class="pb-tt">' + b.icone + ' <h3>' + esc(b.nome) + '</h3>' +
        '<span class="tp">' + b.tempo + '</span></div>';
    if (!itens.length) {
      h += '<p style="font-size:13px;color:var(--muted-2);padding:2px 0 4px">' + esc(b.desc) + '</p>';
    }
    itens.forEach(function(e){
      h += '<div class="pi">' +
        '<span class="cd">' + esc(e.id) + '</span>' +
        '<button class="nm" data-ficha="' + e.id + '" style="text-align:left">' + esc(e.nome) + '</button>' +
        '<input class="mn" type="number" inputmode="numeric" min="1" max="60" ' +
          'data-min="' + e.id + '" value="' + minNoPlano(e.id) + '" ' +
          'aria-label="Minutos de ' + esc(e.nome) + '">' +
        '<div class="acs">' +
          '<button class="mv" data-sobe="' + e.id + '" aria-label="Subir">▲</button>' +
          '<button class="mv" data-desce="' + e.id + '" aria-label="Descer">▼</button>' +
          '<button data-trocar="' + e.id + '">⇄ trocar</button>' +
          '<button class="x" data-add="' + e.id + '">✕ tirar</button>' +
        '</div>' +
        // detalhe que só aparece no papel: o professor leva a ficha para a quadra,
        // com o desenho da montagem ao lado do passo a passo
        '<div class="det">' +
          '<div class="det-qd">' + svgQuadra(e.fig) + '</div>' +
          '<div class="det-tx">' +
            '<b>Tempo:</b> ' + minNoPlano(e.id) + ' min' +
            '<br><b>Objetivo:</b> ' + esc(e.objetivo) +
            '<br><b>Montagem:</b> ' + esc(e.montagem) +
            '<br><b>Como aplicar:</b> ' +
            '<ol class="det-pa">' + (e.passos || []).map(function(t){
                return '<li>' + esc(t) + '</li>'; }).join('') + '</ol>' +
            (PLANO.nivel && e.prog[PLANO.nivel]
              ? '<b>No nível ' + esc(nivel(PLANO.nivel).nome) + ':</b> ' + esc(e.prog[PLANO.nivel]) + '<br>' : '') +

    });

           esc(b.nome.toLowerCase()) + '</button>';
    }
    h += '</div>';
  });

  if (PLANO.itens.length) {
    h += '<div class="bloco-tx" style="margin-top:6px"><div class="tt">Lembrete da metodologia</div>' +
      '<p style="font-size:13.5px;color:var(--muted)">A ativação de base é sagrada — ela mantém a espiral girando em todos os níveis. ' +
      'E todo tema do dia termina aplicado em jogo: técnica que não vira jogo é coreografia.</p></div>';
  }
  h += '<div class="imprimivel">Academia JV Tênis · Metodologia Da Base ao Topo · Banco de exercícios ' +
       esc(VERSAO_BANCO) + '</div>';
  el('planoCorpo').innerHTML = h;

  var a = el('pAluno'), n = el('pNivel');
  if (a) a.oninput = function(){ PLANO.aluno = a.value; guardar(CH_PLANO, PLANO); };
  if (n) n.onchange = function(){ PLANO.nivel = n.value; guardar(CH_PLANO, PLANO); };
  if (el('pAuto60')) el('pAuto60').onclick = function(){ montarAuto(60); };
  if (el('pAuto90')) el('pAuto90').onclick = function(){ montarAuto(90); };
  el('planoCorpo').querySelectorAll('[data-min]').forEach(function(c){
    c.onchange = function(){ mudarMin(c.getAttribute('data-min'), c.value); };
  });
  el('planoTitulo').textContent = 'Aula · ' + t.nome;
}

/* Monta uma aula do tema respeitando os 4 blocos e o tempo disponível.
   Não é mágica: escolhe entre o que passa nos filtros de nível, material e
   formato, e prefere o que o professor já marcou como favorito. O plano sai
   para ser editado — tirar, trocar e reordenar é a parte humana.

   A conta é separada de quem a usa (montarLista devolve a lista e não mexe em
   nada) porque a faixa "Aula pronta" precisa mostrar o que sairia SEM apagar
   o plano que o professor já tem na mão. */
function montarLista(minutos, temaId, niveis){
  var t = tema(temaId) || temaDoMes();
  var nvs = niveis || [];
  // proporção dos blocos na anatomia da aula JV (apostila, seção 5.1)
  var alvo = { ativacao:0.18, tema:0.40, jogo:0.33, fechamento:0.07 };
  var escolhidos = [];
  function jaTem(id){ return escolhidos.some(function(x){ return x.id === id; }); }

  BLOCOS.forEach(function(b){
    var teto = Math.max(4, Math.round(minutos * alvo[b.id]));
    var cand = BANCO.filter(function(e){
      if (e.bloco !== b.id) return false;
      if (e.tema.indexOf(t.id) < 0) return false;
      if (nvs.length && !nvs.some(function(n){ return e.niveis.indexOf(n) >= 0; })) return false;
      if (F.form && e.form.indexOf(F.form) < 0) return false;
      if (F.mat) {
        var so = e.mat.filter(function(m){ return m !== 'nada'; });
        if (so.length && so.indexOf(F.mat) < 0) return false;
      }
      return true;
    });
    // ordem de confiança: favoritos, depois os da apostila, depois os mais longos
    // (mais longo primeiro aproveita melhor o tempo do bloco)
    cand.sort(function(a, b2){
      var fa = (FAV.indexOf(a.id) >= 0 ? 0 : 1) - (FAV.indexOf(b2.id) >= 0 ? 0 : 1);
      if (fa) return fa;
      var ap = (a.fonte === 'apostila' ? 0 : 1) - (b2.fonte === 'apostila' ? 0 : 1);
      if (ap) return ap;
      return b2.min - a.min;
    });

    var usado = 0;
    cand.forEach(function(e){
      if (jaTem(e.id)) return;
      if (b.id === 'fechamento' && usado > 0) return;     // um fechamento basta
      if (usado === 0 || usado + e.min <= teto) {
        escolhidos.push({ id:e.id, bloco:b.id });
        usado += e.min;
      }
    });

    // sobrou tempo no bloco? enche com o maior exercício que ainda cabe
    if (b.id !== 'fechamento') {
      var sobra = teto - usado;
      while (sobra >= 6) {
        var melhor = null;
        cand.forEach(function(e){
          if (jaTem(e.id) || e.min > sobra) return;
          if (!melhor || e.min > melhor.min) melhor = e;
        });
        if (!melhor) break;
        escolhidos.push({ id:melhor.id, bloco:b.id });
        usado += melhor.min;
        sobra = teto - usado;
      }
    }
  });

  return escolhidos;
}

function montarAuto(minutos){
  var t = F.tema ? tema(F.tema) : temaDoMes();
  // o nível do plano manda; se ele está em branco, valem os níveis da tira
  var nvs = PLANO.nivel ? [PLANO.nivel] : F.niveis.slice();
  PLANO.itens = montarLista(minutos, t.id, nvs);
  PLANO.tema = t.id;
  if (nvs.length === 1) PLANO.nivel = nvs[0];
  guardar(CH_PLANO, PLANO);
  atualizar(); desenharPlano();
  if (!el('fundoPlano').classList.contains('aberto')) abrir('fundoPlano');
}

/* A faixa "Aula pronta": mostra, antes de qualquer toque, o que sairia com o
   tema e o nível que estão escolhidos agora. */
function desenharPronta(){
  var t = F.tema ? tema(F.tema) : temaDoMes();
  var nvs = F.niveis.slice();
  var itens = montarLista(60, t.id, nvs);
  var min = itens.reduce(function(a, i){
    var e = acharEx(i.id);
    return a + (e ? e.min : 0);
  }, 0);
  var blocos = BLOCOS.filter(function(b){
    return itens.some(function(i){ return i.bloco === b.id; });
  }).length;
  var nvTx = nvs.map(function(n){ return nivel(n).nome; }).join(' + ');
  // o tema na linha de cima e o nível na de baixo: juntos não cabiam na tela
  // do celular e o nome do nível saía cortado justamente onde importa
  el('prontaSub').textContent = t.nome;
  el('prontaMini').textContent = (nvTx ? (nvs.length > 1 ? 'níveis ' : 'nível ') + nvTx
                                       : 'todos os níveis') + ' · ' +
    (!itens.length ? 'nada neste tema para este nível'
      : itens.length + ' exercícios · ' + min + ' min' +
        // os 4 blocos sao o normal (conferido nas 72 combinacoes de tema, nivel
        // e duracao); so' avisa quando faltar algum, que e' o caso raro
        (blocos < BLOCOS.length ? ' · só ' + blocos + ' de 4 blocos' : ''));
  el('pronta60').disabled = !itens.length;
  el('pronta90').disabled = !itens.length;
}

function copiarPlano(){
  var txt = planoTexto();
  function aviso(){
    var d = document.createElement('div');
    d.className = 'aviso'; d.textContent = '✓ plano copiado — cole no WhatsApp ou no caderno';
    el('planoCorpo').insertBefore(d, el('planoCorpo').firstChild);
    setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 2600);
  }
  if (navigator.share) {
    navigator.share({ title:'Plano de aula JV Tênis', text:txt }).catch(function(){ areaTexto(txt, aviso); });
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(aviso, function(){ areaTexto(txt, aviso); });
  } else areaTexto(txt, aviso);
}

/* Reserva para quando não existe clipboard nem share (Safari antigo, http). */
function areaTexto(txt, depois){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.top = '-1000px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); depois(); } catch(e){ window.prompt('Copie o plano:', txt); }
  document.body.removeChild(ta);
}

/* ==========================================================================
   TROCAR E ACRESCENTAR NO PLANO
   --------------------------------------------------------------------------
   O plano montado pelo app é um ponto de partida; quem dá a aula é que sabe
   que aquele exercício não serve hoje. Trocar um por outro do mesmo bloco, ou
   acrescentar mais um, tinha que passar por fechar o plano, achar o exercício
   na lista e voltar — três telas para uma decisão de dois segundos.
   ========================================================================== */
var TROCANDO = '';        // id que vai sair, vazio quando é só acrescentar

function candidatos(blocoId){
  var t = temaDoPlano();
  var dentro = PLANO.itens.map(function(i){ return i.id; });
  var r = BANCO.filter(function(e){
    if (e.bloco !== blocoId) return false;
    if (dentro.indexOf(e.id) >= 0 && e.id !== TROCANDO) return false;
    if (e.id === TROCANDO) return false;
    if (e.tema.indexOf(t.id) < 0) return false;
    if (PLANO.nivel && e.niveis.indexOf(PLANO.nivel) < 0) return false;
    return true;
  });
  // nada no tema e no nível? abre para o bloco inteiro, avisando na tela —
  // melhor oferecer algo de fora do tema do que uma lista vazia
  if (!r.length) {
    r = BANCO.filter(function(e){
      return e.bloco === blocoId && dentro.indexOf(e.id) < 0;
    });
    return { itens:r, largo:true };
  }
  return { itens:r, largo:false };
}

function abrirEscolher(blocoId, trocarId){
  TROCANDO = trocarId || '';
  var b = bloco(blocoId), t = temaDoPlano();
  var r = candidatos(blocoId);
  el('escCod').textContent = b.icone + ' ' + b.nome;
  el('escTitulo').textContent = TROCANDO ? 'Trocar por' : 'Acrescentar';
  var h = '<p style="font-size:13.5px;color:var(--muted);margin-bottom:12px">' +
    (r.largo ? 'Nada em <b>' + esc(t.nome) + '</b>' +
        (PLANO.nivel ? ' no nível ' + esc(nivel(PLANO.nivel).nome) : '') +
        ' para este bloco — mostrando o bloco inteiro.'
      : esc(t.nome) + (PLANO.nivel ? ' · nível ' + esc(nivel(PLANO.nivel).nome) : '') +
        ' · ' + r.itens.length + ' opções') + '</p>';
  h += r.itens.map(function(e){
    return '<div class="card" data-escolher="' + e.id + '" data-bloco-alvo="' + blocoId + '"' +
      ' role="button" tabindex="0" aria-label="Usar ' + esc(e.nome) + '">' +
      '<div class="miniq">' + svgQuadra(e.fig, { mini:true }) + '</div>' +
      '<div class="mid"><h3>' + esc(e.nome) + '</h3>' +
        '<div class="sinais"><span class="sinal min">' + e.min + '′</span>' +
          reguaNiveis(e) +
          '<span class="sinal"><span class="cd">' + esc(e.id) + '</span></span></div></div>' +
      '<span class="add" aria-hidden="true">' + (TROCANDO ? '⇄' : '+') + '</span></div>';
  }).join('') || '<div class="vazio"><b>Nada disponível neste bloco.</b>' +
      'Todos os exercícios dele já estão no plano.</div>';
  el('escCorpo').innerHTML = h;
  abrir('fundoEscolher');
}

function escolhido(id, blocoId){
  if (TROCANDO) {
    PLANO.itens = PLANO.itens.map(function(i){
      return i.id === TROCANDO ? { id:id, bloco:i.bloco } : i;   // o minuto ajustado era do outro
    });
  } else {
    PLANO.itens.push({ id:id, bloco:blocoId });
  }
  TROCANDO = '';
  guardar(CH_PLANO, PLANO);
  fechar('fundoEscolher');
  atualizar(); desenharPlano();
}

/* ==========================================================================
   MEUS EXERCÍCIOS — criar, editar e levar para outro aparelho
   --------------------------------------------------------------------------
   Os 116 do banco vêm de exercicios.js e não se editam no celular: são a
   metodologia, e mudá-los sem querer em quadra seria pior que não poder
   mudá-los. O que o professor cria fica em MEUS, no localStorage deste
   aparelho, e entra em tudo: busca, filtro, plano, aula pronta e impressão.

   Como o app não fala com servidor nenhum (é o que o deixa abrir offline em
   quadra), passar os exercícios para o outro professor é por texto: exportar
   gera um bloco para copiar, importar recebe o mesmo bloco.
   ========================================================================== */

/* Cenas prontas para o desenho. Desenhar uma quadra num celular pediria um
   editor de arrastar que ninguém usaria em quadra; escolher a cena mais
   parecida e descrevê-la em uma frase resolve o mesmo problema em dois

   11,885 é a linha de base. */
var CENAS = [
  { id:'prof-lanca', nome:'Professor lança, aluno no fundo', base:'meia', el:[
      ['prof', 0, -2.6, 'lança'],
      ['bola', 0, -2.4, 0, 9.4, .35, ''],

      ['prof', 0, -2.6, 'lança'],

  { id:'alvo', nome:'Alvo do outro lado', base:'meia', el:[
      ['aluno', 0, 11.0, 'bate'],
      ['bola', 0, 10.8, 2.8, -1.2, .35, ''],
      ['zona', 2.8, -1.6, 2.6, 2.6, 'alvo'] ] },
  { id:'kids', nome:'Mini quadra (kids)', base:'mini', el:[
      ['prof', 0, -2.6, 'lança'],
      ['bola', 0, -2.4, 0, 4.4, .3, ''],
      ['aluno', 0, 5.2, ''] ] },
  { id:'vazia', nome:'Quadra vazia (só a frase explica)', base:'meia', el:[] }
];

function cena(id){
  for (var i = 0; i < CENAS.length; i++) if (CENAS[i].id === id) return CENAS[i];
  return CENAS[0];
}

/* Um exercício só entra no banco se tiver tudo o que a tela lê. Vale para o
   que vem do formulário e para o que vem de uma importação — um registro pela
   metade quebraria a lista inteira, não só ele. */
function exValido(e){
  return !!(e && typeof e.id === 'string' && e.nome && e.objetivo && e.montagem &&
    e.erro && e.sucesso && e.fig && e.fig.el &&
    Array.isArray(e.tema) && e.tema.length &&
    Array.isArray(e.niveis) && e.niveis.length &&
    bloco(e.bloco) && typeof e.min === 'number' && e.min > 0);
}

/* Prefixo JV, que o banco não usa (ele usa D, F, M, FH, BH, R, S e T). Com
   "M" o exercício novo saía M12, coladinho nos M01..M11 de movimentação — e
   o código é o que o professor lê em quadra para achar a ficha. */
function proximoId(){
  var n = 1, id;
  do { id = 'JV' + (n < 10 ? '0' : '') + n; n++; } while (acharEx(id));
  return id;
}

function linhas(txt){
  return String(txt || '').split('\n')
    .map(function(t){ return t.trim(); })
    .filter(function(t){ return t.length > 0; });
}

        'O app não fala com servidor nenhum — é isso que o deixa abrir offline em ' +
        'quadra. Para passar os seus exercícios ao outro professor, copie o bloco ' +
        'abaixo e mande; do outro lado, cole no mesmo lugar e toque em importar.</p>' +
      '<textarea id="meusTexto" rows="5" spellcheck="false" ' +
        'style="width:100%;background:var(--navy-2);border:1px solid var(--line-2);' +
        'border-radius:11px;color:var(--cream);padding:10px;font-size:12.5px">' +
        esc(JSON.stringify(MEUS)) + '</textarea>' +
      '<div class="linha" style="margin-top:10px">' +
        '<button class="btn btn-line pq" id="meusCopiar">Copiar</button>' +
        '<button class="btn btn-esc pq" id="meusImportar">Importar o que está aí</button>' +
      '</div>' +
      '<p id="meusAviso" style="font-size:13px;color:var(--gold-soft);margin-top:9px">' +
      esc(AVISO_MEUS) + '</p>' +
    '</div></details>';
  el('meusCorpo').innerHTML = h;
  if (AVISO_MEUS) {
    el('meusCorpo').querySelector('details').open = true;   // a resposta tem que estar à vista
    AVISO_MEUS = '';
  }

  el('meusNovo').onclick = function(){ abrirEditor(''); };
  el('meusCopiar').onclick = function(){
    var t = el('meusTexto');
    t.select();
    try { document.execCommand('copy'); } catch(erro){}
    if (navigator.clipboard) navigator.clipboard.writeText(t.value).catch(function(){});
    el('meusAviso').textContent = 'Copiado. Cole no WhatsApp e mande.';
  };
  el('meusImportar').onclick = importarMeus;
  abrir('fundoMeus');
}

function importarMeus(){
  var aviso = el('meusAviso'), lidos;
  try { lidos = JSON.parse(el('meusTexto').value); } catch(erro){ lidos = null; }
  if (!Array.isArray(lidos)) { aviso.textContent = 'Não entendi esse texto. Cole o bloco inteiro, das chaves ao fim.'; return; }
  var bons = lidos.filter(exValido);
  if (!bons.length) { aviso.textContent = 'Nenhum exercício completo nesse texto.'; return; }
  var novos = 0, trocados = 0;
  bons.forEach(function(e){
    var i = MEUS.map(function(m){ return m.id; }).indexOf(e.id);
    e.fonte = 'meu';
    if (i >= 0) { MEUS[i] = e; trocados++; }
    else if (EX.some(function(x){ return x.id === e.id; })) {
      e.id = proximoId(); MEUS.push(e); novos++;   // id batia com o banco: renumera
    } else { MEUS.push(e); novos++; }
  });
  guardarMeus(); atualizar();
  AVISO_MEUS = novos + ' novo(s), ' + trocados + ' atualizado(s)' +
    (bons.length < lidos.length ? ' · ' + (lidos.length - bons.length) + ' incompleto(s), fora' : '');
  abrirMeus();
}

function campo(rot, dentro, dica){

}

function abrirEditor(id){
  EDITANDO = id;
  var e = id ? MEUS.filter(function(x){ return x.id === id; })[0] : null;
  if (id && !e) return;
  var vazio = { tema:[], niveis:[], mat:[], form:[], nec:[], passos:[], foco:[],
                erros:[], dificultar:[], fig:{ base:'meia', el:cena('prof-lanca').el, nota:'' } };
  var v = e || vazio;

  /* O checar-exercicios.js confere cada id procurado pelo JS contra os id=""
     escritos no arquivo, e id montado por concatenação ele não consegue
     conferir — essa checagem já pegou erro de verdade aqui. Por isso o id vem
     escrito por extenso na chamada, e não montado dentro da função. */
  function area(abre, valor){
    return abre + esc(valor) + '</textarea>';
  }
  function entrada(abre, valor, dica){
    return abre + ' value="' + esc(valor) + '" placeholder="' + esc(dica || '') + '">';

  function opcoes(lista, atual, rotulo){
    return lista.map(function(o){
      return '<option value="' + esc(o.id !== undefined ? o.id : o.n) + '"' +

  function marcaveis(nome, lista, marcados){
    return '<div class="ed-chips">' + lista.map(function(o){
      return '<button type="button" class="chip' + (marcados.indexOf(o.id) >= 0 ? ' on' : '') +

    }).join('') + '</div>';

  el('edCod').textContent = e ? e.id : 'novo';
  el('edTitulo').textContent = e ? 'Editar exercício' : 'Criar exercício';
  el('edApagar').style.display = e ? '' : 'none';

  el('edCorpo').innerHTML =
    '<p class="ed-erro" id="edErro" hidden></p>' +
    campo('Nome do exercício', entrada('<input id="exNome"', v.nome || '', 'Ex.: Cruzado com alvo')) +
    campo('Tema do mês', '<select id="exTema">' +
      opcoes(TEMAS, v.tema[0] || temaDoMes().id, function(t){ return t.nome + ' · ' + t.mesesTx; }) +
      '</select>', 'em que mês do calendário ele entra') +
    campo('Bloco da aula', '<select id="exBloco">' +
      opcoes(BLOCOS, v.bloco || 'tema', function(b){ return b.icone + ' ' + b.nome + ' (' + b.tempo + ')'; }) +
      '</select>') +
    campo('Serve para os níveis', marcaveis('nivel', NIVEIS, v.niveis),
      'marque todos em que o exercício funciona') +
    '<div class="ed-dois">' +
      campo('Duração', '<input id="exMin" type="number" min="2" max="45" value="' + (v.min || 10) + '">', 'minutos') +
      campo('Intensidade', '<select id="exInt">' +
        ['baixa','media','alta'].map(function(x){
          return '<option value="' + x + '"' + (v.int === x ? ' selected' : '') + '>' +
            ({ baixa:'Baixa', media:'Média', alta:'Alta' })[x] + '</option>'; }).join('') +
        '</select>') +
    '</div>' +
    campo('Objetivo', area('<textarea id="exObj" rows="2" spellcheck="true">', v.objetivo || ''), 'uma frase: para quê serve') +
    campo('Montagem', area('<textarea id="exMont" rows="2" spellcheck="true">', v.montagem || ''), 'o que precisa estar na quadra') +
    campo('Como aplicar', area('<textarea id="exPassos" rows="4" spellcheck="true">', (v.passos || []).join('\n')), 'um passo por linha') +
    campo('Erro mais comum', entrada('<input id="exErro"', v.erro || '')) +
    campo('Funcionou se', entrada('<input id="exSucesso"', v.sucesso || ''), 'o critério que fecha o exercício') +

    '<details class="gaveta"><summary>🎾 O desenho</summary><div class="dentro">' +
      campo('Cena', '<select id="exCena">' +
        CENAS.map(function(c){ return '<option value="' + c.id + '">' + esc(c.nome) + '</option>'; }).join('') +
        '<option value="copiar">— copiar o desenho de outro exercício —</option></select>') +
      '<div id="exCopiaCx" hidden>' + campo('Copiar de', '<select id="exCopia">' +
        EX.map(function(x){ return '<option value="' + x.id + '">' + esc(x.id + ' · ' + x.nome) + '</option>'; }).join('') +
        '</select>') + '</div>' +
      campo('O que está no desenho', area('<textarea id="exNota" rows="2" spellcheck="true">', (v.fig && v.fig.nota) || ''),
        'a frase que aparece embaixo da figura') +
      '<div class="qd-cx" id="exPreview"></div>' +
    '</div></details>' +

    '<details class="gaveta"><summary>✅ Foco, erros e como dificultar</summary><div class="dentro">' +
      campo('Foco do professor', area('<textarea id="exFoco" rows="3" spellcheck="true">', (v.foco || []).join('\n')), 'um por linha') +
      campo('Outros erros comuns', area('<textarea id="exErros" rows="3" spellcheck="true">', (v.erros || []).join('\n')), 'um por linha') +
      campo('Como dificultar', area('<textarea id="exDificultar" rows="3" spellcheck="true">', (v.dificultar || []).join('\n')), 'um por linha') +
      campo('Dica extra', area('<textarea id="exDica" rows="2" spellcheck="true">', v.dica || '')) +
    '</div></details>' +

    '<details class="gaveta"><summary>🎒 Material, formato e camada</summary><div class="dentro">' +
      campo('Material', marcaveis('mat', MATERIAIS.filter(function(m){ return m.id !== 'nada'; }), v.mat),
        'nada marcado = só a quadra') +
      campo('Formato da aula', marcaveis('form', FORMATOS, v.form)) +
      campo('Camada da Pirâmide', '<select id="exCam">' +
        opcoes(CAMADAS, v.camada || 4, function(c){ return c.n + ' — ' + c.nome; }) + '</select>') +
      campo('Variação por nível', area('<textarea id="exProg" rows="5" spellcheck="true">', NIVEIS.map(function(n){
        return n.nome + ': ' + ((v.prog && v.prog[n.id]) || ''); }).join('\n')),
        'uma linha por nível, no formato "Nível: o que muda". Linha em branco depois dos dois-pontos é ignorada.') +
    '</div></details>';

  // estado dos chips, guardado fora do DOM para o salvar ler de um lugar só
  el('edCorpo').dataset.nivel = (v.niveis || []).join(',');
  el('edCorpo').dataset.mat = (v.mat || []).join(',');
  el('edCorpo').dataset.form = (v.form || []).join(',');

  el('exCena').onchange = function(){
    el('exCopiaCx').hidden = this.value !== 'copiar';
    verPreview();
  };
  el('exCopia').onchange = verPreview;
  verPreview();
  abrir('fundoEditor');
}

function figDoFormulario(){
  var esc2 = el('exCena').value;
  if (esc2 === 'copiar') {
    var o = acharEx(el('exCopia').value);
    var f = o ? JSON.parse(JSON.stringify(o.fig)) : { base:'meia', el:[] };
    f.nota = el('exNota').value.trim() || f.nota || '';
    return f;
  }
  var c = cena(esc2);
  return { base:c.base, el:JSON.parse(JSON.stringify(c.el)), nota:el('exNota').value.trim() };
}

function verPreview(){
  el('exPreview').innerHTML = svgQuadra(figDoFormulario());
}

function marcados(nome){
  var v = el('edCorpo').dataset[nome] || '';
  return v ? v.split(',') : [];
}

function alternarMarca(nome, valor, botao){
  var lista = marcados(nome), i = lista.indexOf(valor);
  if (i >= 0) lista.splice(i, 1); else lista.push(valor);
  el('edCorpo').dataset[nome] = lista.join(',');
  botao.classList.toggle('on', i < 0);
}

function salvarEditor(){
  var faltando = [];
  function pega(id, rot){
    var t = el(id).value.trim();
    if (!t && rot) faltando.push(rot);
    return t;
  }
  var nome = pega('exNome', 'o nome');
  var obj = pega('exObj', 'o objetivo');
  var mont = pega('exMont', 'a montagem');
  var passos = linhas(el('exPassos').value);
  if (!passos.length) faltando.push('pelo menos um passo em "como aplicar"');
  var erro = pega('exErro', 'o erro mais comum');
  var sucesso = pega('exSucesso', 'o "funcionou se"');
  var niveis = marcados('nivel');
  if (!niveis.length) faltando.push('pelo menos um nível');
  var min = Number(el('exMin').value) || 0;
  if (min < 2) faltando.push('a duração (2 min ou mais)');

  if (faltando.length) {
    var av = el('edErro');
    av.hidden = false;
    av.textContent = 'Falta ' + (faltando.length === 1 ? '' : 'preencher: ') + faltando.join(', ') + '.';
    el('edCorpo').scrollTop = 0;
    el('edCorpo').parentNode.scrollTop = 0;
    return;
  }

  var prog = {};
  linhas(el('exProg').value).forEach(function(l){
    var i = l.indexOf(':');
    if (i < 0) return;
    var nm = l.slice(0, i).trim().toLowerCase(), tx = l.slice(i + 1).trim();
    if (!tx) return;
    NIVEIS.forEach(function(n){ if (n.nome.toLowerCase() === nm || n.id === nm) prog[n.id] = tx; });
  });

  var mat = marcados('mat'), form = marcados('form');
  var novo = {
    id: EDITANDO || proximoId(),
    nome: nome, fonte: 'meu',
    tema: [el('exTema').value],
    camada: Number(el('exCam').value) || 4,
    bloco: el('exBloco').value,
    niveis: NIVEIS.map(function(n){ return n.id; }).filter(function(n){ return niveis.indexOf(n) >= 0; }),
    min: min, int: el('exInt').value,
    objetivo: obj, montagem: mont,
    execucao: passos.join(' '),
    prog: prog, erro: erro, sucesso: sucesso,
    mat: mat.length ? mat : ['nada'],
    form: form.length ? form : FORMATOS.map(function(f){ return f.id; }),
    nec: [], fig: figDoFormulario(),
    passos: passos, dica: el('exDica').value.trim(),
    foco: linhas(el('exFoco').value),
    erros: linhas(el('exErros').value),
    dificultar: linhas(el('exDificultar').value)
  };
  if (!exValido(novo)) { el('edErro').hidden = false; el('edErro').textContent = 'Faltou alguma coisa.'; return; }

  var i = MEUS.map(function(m){ return m.id; }).indexOf(novo.id);
  if (i >= 0) MEUS[i] = novo; else MEUS.push(novo);
  guardarMeus();
  fechar('fundoEditor');
  atualizar();
  abrirMeus();
}

function apagarEditor(){
  if (!EDITANDO) return;
  var e = MEUS.filter(function(x){ return x.id === EDITANDO; })[0];
  if (!window.confirm('Apagar "' + (e ? e.nome : EDITANDO) + '"? Ele sai também dos planos.')) return;
  MEUS = MEUS.filter(function(x){ return x.id !== EDITANDO; });
  PLANO.itens = PLANO.itens.filter(function(i){ return i.id !== EDITANDO; });
  guardarMeus(); guardar(CH_PLANO, PLANO);
  fechar('fundoEditor');
  atualizar();
  abrirMeus();
}

/* ==========================================================================
   ABRIR / FECHAR
   ========================================================================== */
var FOLHAS = ['fundoFicha','fundoPlano','fundoMes','fundoMeus','fundoEditor','fundoEscolher'];
var ROLAGEM = 0;

function algumaAberta(){
  return FOLHAS.some(function(id){ return el(id).classList.contains('aberto'); });
}

/* overflow:hidden no body NAO segura a rolagem no Safari do iPhone: a pagina
   continua andando atras da folha, e o arrasto dentro dela sai errado. O que
   segura e' tirar o body do fluxo e devolver a posicao ao fechar. */
function travarRolagem(){
  ROLAGEM = window.pageYOffset || document.documentElement.scrollTop || 0;
  var b = document.body.style;
  b.position = 'fixed'; b.top = (-ROLAGEM) + 'px'; b.left = '0'; b.right = '0'; b.width = '100%';
}
function destravarRolagem(){
  var b = document.body.style;
  b.position = ''; b.top = ''; b.left = ''; b.right = ''; b.width = '';
  window.scrollTo(0, ROLAGEM);
}

function abrir(id){
  var tinha = algumaAberta();
  // folha que já estava aberta não volta ao topo: abrirFicha() é chamado de
  // novo ao pôr no plano, e pular para o topo no meio da leitura era pior que
  // o botão não atualizar
  if (!el(id).classList.contains('aberto')) {
    var folha = el(id).querySelector('.folha');
    if (folha) folha.scrollTop = 0;
  }
  el(id).classList.add('aberto');
  if (!tinha) travarRolagem();
}
function fechar(id){
  el(id).classList.remove('aberto');
  if (!algumaAberta()) destravarRolagem();
}

/* ==========================================================================
   LIGAÇÕES
   ========================================================================== */
/* Arrastar para rolar as tiras de filtro ou a lista terminava abrindo o que
   estava embaixo do dedo: o navegador manda um clique quando o dedo quase nao
   anda, e "quase" e' generoso demais para uma tira que rola de lado. Aqui o
   gesto e' medido, e acima de 10 px ele e' arrasto, nao toque. */
var ARRASTOU = false, TOQUE0 = null;

function marcarInicio(x, y){ TOQUE0 = [x, y]; ARRASTOU = false; }
function marcarMovimento(x, y){
  if (!TOQUE0) return;
  if (Math.abs(x - TOQUE0[0]) > 10 || Math.abs(y - TOQUE0[1]) > 10) ARRASTOU = true;
}

function ligarGestos(){
  document.addEventListener('pointerdown', function(ev){ marcarInicio(ev.clientX, ev.clientY); }, true);
  document.addEventListener('pointermove', function(ev){ marcarMovimento(ev.clientX, ev.clientY); }, true);
  document.addEventListener('touchstart', function(ev){
    var t = ev.touches[0]; if (t) marcarInicio(t.clientX, t.clientY);
  }, { passive:true, capture:true });
  document.addEventListener('touchmove', function(ev){
    var t = ev.touches[0]; if (t) marcarMovimento(t.clientX, t.clientY);
  }, { passive:true, capture:true });
}

function ligar(){
  ligarGestos();
  document.addEventListener('click', function(ev){
    if (ARRASTOU) { ARRASTOU = false; return; }
    var a = ev.target.closest ? ev.target.closest('[data-tema],[data-nivel],[data-bloco],[data-ficha],[data-add],[data-fecha],[data-favorito],[data-sobe],[data-desce],[data-aba],[data-editar],[data-marca],[data-trocar],[data-mais],[data-escolher]') : null;
    if (!a) return;

    if (a.hasAttribute('data-marca')) {
      alternarMarca(a.getAttribute('data-marca'), a.getAttribute('data-valor'), a); return;
    }
    if (a.hasAttribute('data-editar')) { abrirEditor(a.getAttribute('data-editar')); return; }
    if (a.hasAttribute('data-trocar')) {
      var ex = acharEx(a.getAttribute('data-trocar'));
      if (ex) abrirEscolher(ex.bloco, ex.id);
      return;
    }
    if (a.hasAttribute('data-mais')) { abrirEscolher(a.getAttribute('data-mais'), ''); return; }
    if (a.hasAttribute('data-escolher')) {
      escolhido(a.getAttribute('data-escolher'), a.getAttribute('data-bloco-alvo')); return;
    }

    if (a.hasAttribute('data-tema'))  { F.tema = a.getAttribute('data-tema'); atualizar(); window.scrollTo({ top:0, behavior:'smooth' }); return; }
    if (a.hasAttribute('data-nivel')) { alterna(F.niveis, a.getAttribute('data-nivel')); atualizar(); return; }
    if (a.hasAttribute('data-bloco')) { alterna(F.blocos, a.getAttribute('data-bloco')); atualizar(); return; }
    if (a.hasAttribute('data-ficha')) { abrirFicha(a.getAttribute('data-ficha')); return; }
    if (a.hasAttribute('data-add'))   { noPlano(a.getAttribute('data-add')); return; }
    if (a.hasAttribute('data-fecha')) { fechar(a.getAttribute('data-fecha')); return; }
    if (a.hasAttribute('data-aba'))   { trocarAba(a.getAttribute('data-aba')); return; }
    if (a.hasAttribute('data-sobe'))  { mover(a.getAttribute('data-sobe'), -1); return; }
    if (a.hasAttribute('data-desce')) { mover(a.getAttribute('data-desce'), 1); return; }
    if (a.hasAttribute('data-favorito')) {
      var id = a.getAttribute('data-favorito'), i = FAV.indexOf(id);
      if (i >= 0) FAV.splice(i, 1); else FAV.push(id);
      guardar(CH_FAV, FAV); atualizar(); abrirFicha(id); return;
    }
  });

  // fechar clicando no fundo escuro
  FOLHAS.forEach(function(id){
    el(id).addEventListener('click', function(ev){ if (ev.target === el(id)) fechar(id); });
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape') FOLHAS.forEach(fechar);
  });

  // o card e' um <div role="button">: quem usa teclado espera Enter e espaco
  document.addEventListener('keydown', function(ev){
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var a = ev.target.closest ? ev.target.closest('.card[data-ficha],.card[data-editar],.card[data-escolher]') : null;
    if (!a) return;
    ev.preventDefault();
    if (a.hasAttribute('data-editar')) abrirEditor(a.getAttribute('data-editar'));
    else if (a.hasAttribute('data-escolher')) escolhido(a.getAttribute('data-escolher'), a.getAttribute('data-bloco-alvo'));
    else abrirFicha(a.getAttribute('data-ficha'));
  });

  el('edSalvar').addEventListener('click', salvarEditor);
  el('edApagar').addEventListener('click', apagarEditor);

  el('pronta60').addEventListener('click', function(){ montarAuto(60); });
  el('pronta90').addEventListener('click', function(){ montarAuto(90); });
  el('q').addEventListener('input', function(){ F.q = el('q').value.trim(); desenharLista(); });
  el('btnMais').addEventListener('click', function(){
    var ab = el('painel').classList.toggle('aberto');
    document.querySelector('.filtros').classList.toggle('expandido', ab);
    el('btnMais').setAttribute('aria-expanded', ab ? 'true' : 'false');
  });
  el('fNec').addEventListener('change', function(){ F.nec = this.value; marcarChips(); desenharLista(); });
  el('fForm').addEventListener('change', function(){ F.form = this.value; marcarChips(); desenharLista(); });
  el('fCam').addEventListener('change', function(){ F.cam = this.value; marcarChips(); desenharLista(); });
  el('fMat').addEventListener('change', function(){ F.mat = this.value; marcarChips(); desenharLista(); });
  el('fInt').addEventListener('change', function(){ F.int = this.value; marcarChips(); desenharLista(); });
  el('fOrd').addEventListener('change', function(){ F.ord = this.value; desenharLista(); });
  el('cApostila').addEventListener('click', function(){ F.apostila = !F.apostila; marcarChips(); desenharLista(); });
  el('cMeus').addEventListener('click', function(){ F.meus = !F.meus; marcarChips(); desenharLista(); });
  el('btnMeus').addEventListener('click', abrirMeus);
  el('cTransv').addEventListener('click', function(){ F.semTransv = !F.semTransv; marcarChips(); desenharLista(); });
  el('btnFav').addEventListener('click', function(){ F.favs = !F.favs; atualizar(); });
  el('btnLimpar').addEventListener('click', limparFiltros);
  el('focoVer').addEventListener('click', abrirMes);
  el('btnPlano').addEventListener('click', function(){ desenharPlano(); abrir('fundoPlano'); });
  el('btnVerPlano').addEventListener('click', function(){ desenharPlano(); abrir('fundoPlano'); });
  el('btnMontar').addEventListener('click', function(){ montarAuto(60); });
  el('btnCopiar').addEventListener('click', copiarPlano);
  el('btnImprimir').addEventListener('click', function(){ window.print(); });
  el('btnLimparPlano').addEventListener('click', function(){
    if (!PLANO.itens.length || window.confirm('Limpar o plano de aula inteiro?')) {
      PLANO.itens = []; PLANO.tema = ''; guardar(CH_PLANO, PLANO); atualizar(); desenharPlano();
    }
  });
}

function alterna(lista, valor){
  if (!valor) { lista.length = 0; return; }
  var i = lista.indexOf(valor);
  if (i >= 0) lista.splice(i, 1); else lista.push(valor);
}

function limparFiltros(){
  F.tema = ''; F.niveis = []; F.blocos = []; F.nec = ''; F.form = ''; F.cam = '';
  F.mat = ''; F.int = ''; F.q = ''; F.apostila = false; F.meus = false;
  F.semTransv = false; F.favs = false;
  el('q').value = ''; el('fNec').value = ''; el('fForm').value = ''; el('fCam').value = '';
  el('fMat').value = ''; el('fInt').value = '';
  fecharPainel();
  atualizar();
}

function fecharPainel(){
  el('painel').classList.remove('aberto');
  document.querySelector('.filtros').classList.remove('expandido');
  el('btnMais').setAttribute('aria-expanded','false');
}

   ========================================================================== */
function comecar(){
  FAV = ler(CH_FAV, []) || [];
  MEUS = (ler(CH_MEUS, []) || []).filter(exValido);
  montarBanco();
  var p = ler(CH_PLANO, null);
  if (p && p.itens) PLANO = { aluno:p.aluno || '', nivel:p.nivel || '', tema:p.tema || '', itens:p.itens || [] };
  // o app abre já no tema do mês: é o que o professor precisa em 9 de 10 aberturas
  F.tema = temaDoMes().id;
  preencherSelects();
  ligar();
  atualizar();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw-exercicios.js').catch(function(){});
    });
  }
}
comecar();

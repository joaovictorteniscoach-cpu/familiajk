# Site estático (PWA) — sem etapa de build.
# No Netlify, configure "Base directory" = app-gestao para este site.
[build]
  publish = "."
  # Só constrói se algum arquivo desta pasta mudou — os 3 projetos do Netlify
  # saem do mesmo repositório, então isso evita builds inúteis (economiza créditos).
  # Convenção do Netlify: exit 0 = pula o build, exit != 0 = constrói.
  # O "if" garante que, sem referência anterior (cache limpo), ele SEMPRE constrói.
  # Endereço aposentado em 15/10/2026 (autorizado pelo João): só reconstrói se
  # ESTE arquivo mudar. O conteúdo da pasta não importa mais aqui, porque tudo
  # vai para o endereço oficial (redirecionamento abaixo). Economiza créditos.
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify.toml"

# Service worker e manifest não devem ser cacheados de forma agressiva.
[[headers]]
  for = "/sw-gestao.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest-gestao.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Endereço do Netlify aposentado (15/10/2026, autorizado pelo João). Uma cópia
# antiga gravando no mesmo banco é risco de dado errado: todo acesso vai para o
# app oficial no GitHub Pages. 302 (temporário) para poder desfazer: basta
# apagar este bloco. Quem chega por aqui entra de novo no endereço novo (login
# e aparelho são por endereço); os dados estão na nuvem, nada se perde.
[[redirects]]
  from = "/*"
  to = "https://joaovictorteniscoach-cpu.github.io/familiajk/app-gestao/:splat"
  status = 302
  force = true

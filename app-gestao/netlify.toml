# Site estático (PWA) — sem etapa de build.
# No Netlify, configure "Base directory" = app-gestao para este site.
[build]
  publish = "."
  # Só constrói se algum arquivo desta pasta mudou — os 3 projetos do Netlify
  # saem do mesmo repositório, então isso evita builds inúteis (economiza créditos).
  # Convenção do Netlify: exit 0 = pula o build, exit != 0 = constrói.
  # O "if" garante que, sem referência anterior (cache limpo), ele SEMPRE constrói.
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# Service worker e manifest não devem ser cacheados de forma agressiva.
[[headers]]
  for = "/sw-gestao.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest-gestao.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
